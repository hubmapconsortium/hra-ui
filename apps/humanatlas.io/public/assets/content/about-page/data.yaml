  - component: PageSection
    tagline: Editorial Board
    anchor: editorial-board
    level: 2
    content:
      - component: Markdown
        data: |
          The HRA editorial board is composed of experts from pathology, surgery, and single cell research.

          The board meets virtually every six months—in November and May of each year—to
          - advise on setting HRA editorial policies,
          - review HRA extensions (e.g., crosswalks between ASCT+B tables and Azimuth references or OMAPs),
          - select lead organ experts that ensure high-quality submissions/revisions of HRA digital objects,
          - optimize incentive structures (e.g., HRA papers in major journals, awards for high-quality contributions by organ teams/editors/reviewers),
          - discuss commercial and other funding opportunities to sustain the HRA effort, and
          - act as ambassadors for the HRA—promoting the HRA at relevant conferences and within key communities.
