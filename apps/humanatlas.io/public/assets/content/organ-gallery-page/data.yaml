title: HRA Organ Gallery
subtitle: Explore organs, donor data, tissue blocks, datasets, and cells across scales in virtual reality.
icons: product:organ-gallery
action:
  label: Use app
  url: https://www.meta.com/experiences/hra-organ-gallery/5696814507101529/
content:
  - component: PageSection
    tagline: Overview
    anchor: overview
    level: 2
    content:
      component: Markdown
      data: |
        The Human Reference Atlas (HRA) Organ Gallery is a virtual reality (VR) application that lets
        users explore the HRA in immersive 3D and in their true size, location, and spatial relation
        to each other. The HRA Organ Gallery has several use cases: 1) introduce both novice and expert
        users to the 2D and 3D data available in the HRA via the HuBMAP Data Portal, the SenNet Data
        Portal, and similar efforts; (2) enable multiscale harmonization, visualization, and exploration
        of spatial biological data; (3) enable biological queries across scales; and 4) provide quality
        assurance and quality control (QA/QC) for HRA data providers.

        A new preprint is available at [https://www.biorxiv.org/content/10.64898/2026.07.07.737090](https://www.biorxiv.org/content/10.64898/2026.07.07.737090).

        The concept of the application is described in this
        [publication](https://www.frontiersin.org/journals/bioinformatics/articles/10.3389/fbinf.2023.1162723/full).

        Figure 1 compares the user interface for exploring the HRA via the
        [Exploration User Interface (EUI)](https://apps.humanatlas.io/eui/) to how it appears in the
        HRA Organ Gallery when using a Meta Quest VR headset.

        This research is based on work supported by a
        [R03 award by the NIH](https://reporter.nih.gov/search/ywt9ul-G8kuWaSRazYBjJg/project-details/11123677),
        a [NIH HuBMAP JumpStart Fellowship 2024-2025](https://hubmapconsortium.org/jumpstart-program/#andreas2024),
        a HuBMAP NIH JumpStart Award (2023-2024), and a
        [CIFAR](https://cifar.ca/research-programs/cifar-macmillan-multiscale-human/) Catalyst award.

  - component: PageSection
    tagline: Preprint
    anchor: preprint
    level: 2
    content:
      component: Markdown
      data: |
        A preprint describing the HRA Organ Gallery in VR, including the HRA: Powers of Ten application,
        is available at [https://www.biorxiv.org/content/10.64898/2026.07.07.737090](https://www.biorxiv.org/content/10.64898/2026.07.07.737090). A series of video demonstrations is available at https://cns-iu.github.io/hra-organ-gallery-supporting-information/#videos.
        A companion website is available at https://cns-iu.github.io/hra-organ-gallery-supporting-information.

  - component: PageSection
    tagline: Application
    anchor: application
    level: 2
    content:
      component: Markdown
      data: |
        You can download and install the application to your Meta Quest VR headset at https://www.meta.com/experiences/5696814507101529.

  - component: PageSection
    tagline: 2D vs. virtual reality
    anchor: 2d-vs-virtual-reality
    level: 2
    content:
      - component: Markdown
        data: |
          **Left**: A user looks at the HRA with the EUI in a standard-size browser window on a 17-in display.

          **Right**: The HRA Organ Gallery allows the user to view the organs, tissue blocks, and cell type counts of
          the HRA in true scale using VR. <br><br>

      - component: Image
        src: assets/content/organ-gallery-page/images/organ_gallery.png

  - component: PageSection
    tagline: Why virtual reality?
    anchor: why-virtual-reality
    level: 2
    content:
      component: Markdown
      data: |
        Using a visually explicit method of data integration, the HRA enables users to explore disparate data.
        VR presents a unique opportunity to explore both spatial and abstract data in an immersive environment
        that enhances presence beyond traditional interfaces like windows, icons, menus, and pointers, also
        called WIMP paradigm (Van Dam, 1997). Although some users may be able to learn how to explore 3D reference
        organs and tissue blocks on a 2D screen
        (Bueckle et al., [2021](https://journals.plos.org/plosone/article/metrics?id=10.1371/journal.pone.0258103#citedHeader),
        [2022](https://www.frontiersin.org/journals/virtual-reality/articles/10.3389/frvir.2021.727344/full)),
        many still struggle with interacting with 3D objects on a 2D screen.

  - component: PageSection
    tagline: Resources
    anchor: resources
    level: 2
    content:
      component: Markdown
      data: |
        * You can download the application on the Meta Horizon Store: https://www.meta.com/experiences/5696814507101529
        * This paper describes the basic concept: https://doi.org/10.3389/fbinf.2023.1162723
        * A new preprint is available at [https://www.biorxiv.org/content/10.64898/2026.07.07.737090](https://www.biorxiv.org/content/10.64898/2026.07.07.737090).
        * To download the most up-to-date GLB files for the organs of the HRA, please visit the
        [HRA 3D Reference Object Library](https://humanatlas.io/3d-reference-library).

