$schema: ../../../app/schemas/content-page/content-page.schema.json
title: Cell Distance Explorer
subtitle: Compute, visualize, and explore distance distributions.
icons: product:cde
headerContent:
  component: FlexContainer
  columnGap: 2rem
  content:
    - component: Button
      label: Use app
      href: https://apps.humanatlas.io/cde
      type: cta
    - component: Button
      label: Publication
      href: https://doi.org/10.1101/2025.09.23.678129
      type: cta
      variant: secondary
content:
  - component: PageSection
    tagline: Overview
    anchor: overview
    level: 2
    content:
      - component: Markdown
        data: |
          The Cell Distance Explorer reads spatial data with X-Y coordinates for 2D or X-Y-Z coordinates for 3D, along with the cell type at each point. It measures the distance from each cell to the nearest cell of a chosen type and visualizes how those distances are distributed. Users can format and upload their own data or explore published datasets.

          Cell distance distributions can add granularity to our understanding of how disease develops, such as how tumor cells grow or metastasize, in support of targeted therapies.
      - component: GridContainer
        styles:
          background-color: rgba(23, 145, 255, 0.12)
          border-radius: 0.5rem
          padding: .75rem
          padding-bottom: 0rem
          font: var(--mat-sys-label-large)
          display: flex
          gap: .75rem
        content:
          - component: TextHyperlink
            text: ''
            url: ''
            icon: info
            styles:
              pointer-events: none
              --mat-sys-tertiary: '#00529C'
          - component: Markdown
            data: |
              The Cell Distance Explorer works with any spatial data that has X-Y or X-Y-Z coordinates and a category for each point, not only cells. For example, the cell type column can list anatomical structures, such as functional tissue units, or landmarks, such as the edge of an organ. Distances can then be measured to any of those categories.

  - component: PageSection
    tagline: App features
    anchor: app-features
    level: 3
    content:
      - component: Markdown
        data: |
          - **Visualize custom data.** Upload data with X-Y coordinates for 2D or X-Y-Z coordinates for 3D.
          - **Measure distances to an anchor cell type.** Each cell is linked to its nearest anchor cell when one is within the distance threshold. Distances are straight-line (Euclidean) distances in micrometers.
          - **Explore cells in the Visualization panel.** Use **Explore** to zoom, pan, and rotate. Use **Inspect** to see a cell's type, Cell Ontology ID, coordinates, and distance to the closest anchor cell. Use **Select** to draw around cells and delete them from the dataset.
          - **Compare cell types.** In the **Cell types** panel, show or hide cell types, change their colors, and compare cell and link counts.
          - **Compare distance distributions.** The **Histogram** and **Violin graph** panels show distances to the nearest anchor cell for each cell type.
          - **Review sample details.** The **Sample metadata** panel shows file names and any metadata entered during setup.
          - **Download results.** Download the visualization as a PNG file, the histogram and violin graph as PNG or SVG files, and the cells, cell links, and cell color map as CSV files.
          - **Embed the app.** Add the visualization to another website with the [embedding guide](https://github.com/hubmapconsortium/hra-ui/blob/main/apps/cde-visualization-wc/EMBEDDING.md).

          To explore without uploading data, browse published datasets in the [Spatial Omics Gallery](https://apps.humanatlas.io/cde/gallery).
      - component: Image
        src: assets/ui-images/annotated-ui-cde.png
        alt: Annotated screenshot of the Cell Distance Explorer showing the 2D large intestine sample. Callouts describe the Sample metadata panel; the Cell types list with totals, sorting, show and hide checkboxes, color swatches, and the anchor cell type; the Visualization panel with Select, Inspect, and Explore modes and navigation controls; and the Violin graph and Histogram panels and their menus.

  - component: PageSection
    tagline: Demo video
    anchor: demo-video
    level: 3
    content:
      - component: YouTubePlayer
        videoId: onJB6Ee3nLw
        label: Cell distance explorer demo video

  - component: PageSection
    tagline: Example use cases
    anchor: example-use-cases
    level: 3
    content:
      - component: Markdown
        data: |
          - **Blood vessels in colorectal cancer (2D).** See how far tumor, immune, and other cells are from the nearest endothelial cell in a CyCIF sample from the Sorger Lab. [Open the 2D sample](https://apps.humanatlas.io/cde/example/0) or [read the colorectal cancer publication](https://doi.org/10.1016/j.cell.2022.12.028).
          - **Immune cells and vasculature in skin (3D).** Explore distances from immune cells to the nearest endothelial cell in a 3D Cell DIVE reconstruction of human skin from the Fiona Ginty Lab. [Open the 3D sample](https://apps.humanatlas.io/cde/example/1) or [read the skin publication](https://doi.org/10.1038/s42003-023-04991-z).
          - **Endothelial cell environments across organs.** Compare how cells are arranged around blood vessels in studies from more than 10 organs. [Browse the Spatial Omics Gallery](https://apps.humanatlas.io/cde/gallery) or [read the Cell Distance Explorer publication](https://doi.org/10.1101/2025.09.23.678129).
          - **Custom anchors and structures.** With custom data, any category can be the anchor. For example, set tumor cells as the anchor to measure how close immune cells come to a tumor. An [example notebook](https://github.com/x-atlas-consortia/hra-notebooks/blob/main/notebooks/hra-hierarchical-cell-neighborhoods.ipynb) builds a Cell Distance Explorer from published data with hierarchical tissue unit annotations.

  - component: PageSection
    tagline: Create a visualization
    anchor: create-a-visualization
    level: 2
    content:
      - component: Markdown
        data: |
          Upload 2D or 3D cell data to measure how far each cell is from the nearest cell of a chosen type, called the anchor cell type. The [Create visualization page](https://apps.humanatlas.io/cde/create) guides users through six steps, then opens the data in an interactive visualization.

  - component: PageSection
    tagline: Quickstart
    anchor: quickstart
    level: 3
    content:
      - component: Markdown
        data: |
          Try the workflow in about two minutes with the cell data template, a small 3D sample.

          1. Open the [cell data template](https://docs.google.com/spreadsheets/d/1EUf7CUZb0NprgxBeX3nS3GXyUM89edIRH6NSeUsR3nY/edit?gid=47698780#gid=47698780) and select **File** > **Download** > **Comma Separated Values (.csv)**.
          2. Open the [Create visualization page](https://apps.humanatlas.io/cde/create), select **Upload CSV**, and choose the downloaded file. The **X axis**, **Y axis**, **Z axis**, and **Cell type** columns are selected automatically.
          3. Keep the default parameters. Endothelial is the anchor cell type.
          4. Select **Visualize**.

  - component: PageSection
    tagline: Prepare data
    anchor: prepare-data
    level: 3
    content:
      - component: Markdown
        data: |
          Save cell data as a CSV file with a header row and one row per cell. To start from an example, open the [cell data template](https://docs.google.com/spreadsheets/d/1EUf7CUZb0NprgxBeX3nS3GXyUM89edIRH6NSeUsR3nY/edit?gid=47698780#gid=47698780).

          Coordinates can be in pixels or micrometers. The pixel size is set in step 3.
      - component: PageTable
        variant: alternating
        verticalDividers: true
        columns:
          - column: column
            label: Column
          - column: required
            label: Required
          - column: description
            label: Description
          - column: headers
            label: Recognized headers
            type: markdown
        rows:
          - column: X
            required: 'Yes'
            description: X coordinate of the cell.
            headers: '`x`'
          - column: Y
            required: 'Yes'
            description: Y coordinate of the cell.
            headers: '`y`'
          - column: Cell type
            required: 'Yes'
            description: Name of the cell type, such as Endothelial. Can include damage and proliferation markers.
            headers: '`cell type`, `celltype`, `cell_type`'
          - column: Z
            required: For 3D data
            description: Z coordinate of the cell.
            headers: '`z`'
          - column: Cell ontology ID
            required: 'No'
            description: Cell Ontology ID for the cell type, such as CL:0000115. Shown when inspecting a cell.
            headers: '`cell ontology id`, `ontology id`, `cell_ontology_id`, `ontology_id`, `cellontologyid`, `ontologyid`'
      - component: Markdown
        data: |
          Headers aren't case-sensitive. When a header matches a recognized header, the app selects that column automatically. Otherwise, select the column in step 2.

          To use custom colors, also prepare a color map CSV file with one row per cell type. To start from an example, open the [color map template](https://docs.google.com/spreadsheets/d/1sjaGTCs3J9CjrkowxkyJrIfHk64w_nDyYrgprbMbdqE/edit?gid=0#gid=0). Both color map columns are required, and their headers must match a recognized header.
      - component: PageTable
        variant: alternating
        verticalDividers: true
        columns:
          - column: column
            label: Column
          - column: description
            label: Description
          - column: headers
            label: Recognized headers
            type: markdown
        rows:
          - column: Cell type
            description: Name of the cell type, spelled as in the cell data.
            headers: '`cell type`, `celltype`, `cell_type`'
          - column: Cell color
            description: 'Color as a hex code (#RRGGBB) or RGB values ([R, G, B]), such as #FF0000 or [255, 0, 0].'
            headers: '`cell color`, `cellcolor`, `cell_color`, `color`, `colour`, `hex`, `rgb`, `rgba`'

  - component: PageSection
    tagline: Step-by-step guide
    anchor: create-a-visualization-step-by-step
    level: 3
    content:
      - component: Markdown
        data: |
          Open the [Create visualization page](https://apps.humanatlas.io/cde/create) and complete the steps in order. Steps 4 and 5 are optional.

          1. **Upload data.** Select **Upload CSV** and choose the cell data file. To see the expected format, select **Open template**.
          2. **Organize data.** Check that **X axis**, **Y axis**, and **Cell type** use the right columns. For 3D data, select the **Z axis** column. A **Cell ontology ID** column can also be selected.
          3. **Configure parameters.**
              - **Anchor cell type:** The cell type that distances are measured to. The default is Endothelial if the data includes it. Otherwise, it's the first cell type in the file.
              - **Distance threshold (µm):** How far a cell can be from an anchor cell and still be linked to it. The default is 1000. Enter a number greater than 0.
              - **Pixel size (X), (Y), and (Z) (µm/pixel):** Converts coordinates to micrometers. Typical microscopy pixel sizes are 0.1–1 µm/pixel. Use 1 if coordinates are already in micrometers. For 3D data with Z values in slices, set **Pixel size (Z)** to the distance between slices. Enter numbers greater than 0.
          4. **Optional: Add metadata.** Enter a **Visualization title**, **Imaging technology**, **Organ**, **Sex**, **Age**, and **Thickness (µm)**. Metadata appears in the **Sample metadata** panel and doesn't change the visualization.
          5. **Optional: Configure colors.** Keep **Use default colors**, or select **Upload color map** and upload a color map CSV file. Colors can also be changed later in the **Cell types** panel.
          6. **Visualize cell distance data.** Select **Visualize**. If anything is missing, a message above the button explains what to complete.
      - component: GridContainer
        styles:
          background-color: rgba(23, 145, 255, 0.12)
          border-radius: 0.5rem
          padding: .75rem
          padding-bottom: 0rem
          font: var(--mat-sys-label-large)
          display: flex
          gap: .75rem
        content:
          - component: TextHyperlink
            text: ''
            url: ''
            icon: info
            styles:
              pointer-events: none
              --mat-sys-tertiary: '#00529C'
          - component: Markdown
            data: |
              Data can't be changed after selecting **Visualize**. To make changes, create a new visualization. Download any needed files before leaving or refreshing the visualization page.

  - component: PageSection
    tagline: Downloaded files
    anchor: downloaded-files
    level: 3
    content:
      - component: Markdown
        data: |
          Download CSV files from the **Cell types** panel menu, and images from the **Downloads** menu of the **Visualization**, **Histogram**, and **Violin graph** panels. CSV files include only the cell types currently shown and leave out deleted cells. Coordinates and distances are in micrometers.
      - component: PageTable
        variant: alternating
        verticalDividers: true
        columns:
          - column: file
            label: File
          - column: contents
            label: Contents
        rows:
          - file: Cells CSV
            contents: One row per cell. For uploaded data, the columns are Cell Type, Cell Ontology ID, X, Y, and Z. Cell Ontology ID and Z are empty when not provided.
          - file: Cell links CSV
            contents: One row per link between a cell and its nearest anchor cell. Cell ID and Target ID are the row numbers of the cell and the anchor cell in the cells CSV, starting at 0. X1, Y1, and Z1 are the cell's coordinates, X2, Y2, and Z2 are the anchor cell's coordinates, and Distance is the distance between them.
          - file: Cell color map CSV
            contents: One row per cell type, with Cell Type and Cell Color columns. Colors are RGB values. Upload this file in step 5 to reuse the colors in a new visualization.
          - file: Visualization PNG
            contents: Image of the current view in the Visualization panel.
          - file: Histogram and violin graph
            contents: PNG or SVG images of each chart.

  - component: PageSection
    tagline: Troubleshooting
    anchor: troubleshooting
    level: 3
    content:
      - component: Markdown
        data: |
          The Create visualization page shows a message when a file can't be used or a field needs attention. Upload errors also show a second line about what to upload. Text in italics is an example and changes to match the file.
      - component: PageTable
        variant: alternating
        verticalDividers: true
        columns:
          - column: message
            label: Message
            type: markdown
          - column: fix
            label: How to fix it
        rows:
          - message: 'Invalid file type: *xlsx*, expected csv'
            fix: Save the file as a CSV (comma-separated values) file and upload it again.
          - message: 'Invalid file: errors on rows *3, 8*'
            fix: Those rows in the cell data have more or fewer values than the header row, often from an extra comma or a missing quotation mark. Row numbers start at 0 with the first row after the header, so row 3 is row 5 in a spreadsheet. Up to five rows are listed. Fix the rows and upload the file again.
          - message: Please upload a dataset.
            fix: This message appears in steps 2, 3, and 6 until cell data is uploaded in step 1. If a file is already uploaded, it has no rows below the header row. Add cell data and upload the file again.
          - message: 'Please select the required column headers: *X axis, cell type*'
            fix: In step 2, select a column for each field listed. To have columns selected automatically, rename the headers in the file to recognized headers and upload it again.
          - message: Enter more than 0
            fix: In step 3, enter a distance threshold or pixel size greater than 0.
          - message: Enter a whole number, 0–120
            fix: In step 4, enter the age in whole years, from 0 to 120, or leave it empty.
          - message: Enter 0 or more
            fix: In step 4, enter a thickness of 0 µm or more, or leave it empty.
          - message: File is empty.
            fix: The color map uploaded in step 5 has no rows below the header row. Add a row for each cell type and upload the file again.
          - message: 'Required column missing: *Cell Color*'
            fix: The color map uploaded in step 5 needs a cell type column and a cell color column. Rename the column named in the message to a recognized header, such as cell type or cell color, and upload the file again.
          - message: 'Required color format not detected. Please use #RRGGBB or [R, G, B].'
            fix: "The colors in the color map uploaded in step 5 aren't in a supported format. Write each color as a hex code, such as #FF0000, or as RGB values in brackets, such as [255, 0, 0], and use the same format in every row."
          - message: Please complete the required fields above.
            fix: This message appears in step 6. Fill in any empty fields in steps 2 and 3, and fix any field that shows a message. An empty distance threshold or pixel size field doesn't show its own message.
      - component: Markdown
        data: |
          If the visualization doesn't look as expected, check these common causes. Data can't be changed after selecting **Visualize**, so some fixes need a new visualization.
      - component: PageTable
        variant: alternating
        verticalDividers: true
        columns:
          - column: problem
            label: Problem
          - column: fix
            label: How to fix it
            type: markdown
        rows:
          - problem: No cell links, or fewer than expected
            fix: A cell is linked only when an anchor cell is within the distance threshold. Create a new visualization with a larger **Distance threshold (µm)**, or check that the pixel sizes convert coordinates to micrometers. If links are hidden, select **Show cell links** in the **Visualization** panel menu.
          - problem: Distances are much larger or smaller than expected
            fix: Coordinates are multiplied by the pixel sizes to convert them to micrometers. If coordinates are in pixels, create a new visualization and enter the pixel size of each axis in step 3. Use 1 only if coordinates are already in micrometers.
          - problem: 3D data looks flat
            fix: Create a new visualization and select the **Z axis** column in step 2.
          - problem: The visualization looks stretched or squashed
            fix: The pixel sizes may not match the data. Create a new visualization and check **Pixel size (X)**, **Pixel size (Y)**, and **Pixel size (Z)** in step 3. If Z values are slice numbers, set **Pixel size (Z)** to the distance between slices.
          - problem: Some cell types are white
            fix: Cell types missing from an uploaded color map are white. In the color map, spell each cell type exactly as in the cell data, including capitalization and spaces. Colors can also be changed in the **Cell types** panel.
          - problem: Cells are missing
            fix: Check that the cell type is shown in the **Cell types** panel. To restore cells deleted with **Select**, select **Reset** > **Reset deleted cells** in the **Visualization** panel menu. In the file, make sure each coordinate is a number without units or thousands separators.
          - problem: The visualization is gone after refreshing the page
            fix: "Visualizations of uploaded data aren't saved. Refreshing or leaving the page clears the data and opens the Cell Distance Explorer home page. Create the visualization again, and download any needed files before leaving."

  - component: PageSection
    tagline: Code
    anchor: code
    level: 2
    content:
      - component: Markdown
        data: |
          - [Source code on GitHub](https://github.com/hubmapconsortium/hra-ui): The app ([apps/cde-ui](https://github.com/hubmapconsortium/hra-ui/tree/main/apps/cde-ui)) and its visualization ([libs/cde-visualization](https://github.com/hubmapconsortium/hra-ui/tree/main/libs/cde-visualization)) are part of the HRA UI repository.
          - [Embedding guide](https://github.com/hubmapconsortium/hra-ui/blob/main/apps/cde-visualization-wc/EMBEDDING.md): Add the Cell Distance Explorer visualization to any web page as a web component.
          - [HRA Jupyter Widgets](https://github.com/x-atlas-consortia/hra-jupyter-widgets): Use the Cell Distance Explorer in Jupyter notebooks.
          - [HRA Notebooks](https://github.com/x-atlas-consortia/hra-notebooks): Example notebooks, including [Hierarchical Tissue Unit Annotation](https://github.com/x-atlas-consortia/hra-notebooks/blob/main/notebooks/hra-hierarchical-cell-neighborhoods.ipynb), which builds a Cell Distance Explorer widget.

