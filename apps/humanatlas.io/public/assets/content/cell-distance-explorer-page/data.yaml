  - component: PageSection
    tagline: Citation
    anchor: citation
    level: 2
    content:
      - component: Markdown
        data: |
          To cite the Cell Distance Explorer, use:

          Jain, Y., Jepson, J., Chen, R., Maier, E., Herr, B. W., Puig-Barbe, A., Quardokus, E. M., Qaurooni, D., Yapp, C., Ewing, S. L., Enninful, A., Farzad, N., Bueckle, A., Easter, Q. T., Matuck, B., Zhu, C., Monte, E. M., Purkerson, J. M., Jehrio, M., & Misra, R. S. (2025). Exploring endothelial cell environments across organs in spatially resolved omics data. *bioRxiv*. [https://doi.org/10.1101/2025.09.23.678129](https://doi.org/10.1101/2025.09.23.678129)
