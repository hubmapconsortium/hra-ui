          The Cell Distance Explorer is part of the Human Reference Atlas (HRA), developed by the Indiana University Mapping Component. Many thanks to the authors listed in the citation above and to everyone who designed and built the app, including Daniel Bolin, Bruce W. Herr II, Bhushan Khope, Edward Lu, Elizabeth Maier, Gauri Markandey, and Saai Vignesh Premanand.

