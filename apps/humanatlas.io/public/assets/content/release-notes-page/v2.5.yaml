title: Release Notes
subtitle: What's new in the Human Reference Atlas.
headerContent:
  component: ReleaseNotesVersionSelector
content:
  - component: PageSection
    tagline: '11th Release (v2.5): June 15, 2026'
    anchor: announcement
    level: 2
    content:
      - component: Markdown
        data: |
          HuBMAP's Indiana University Mapping Component (MC-IU) has published the 11th Release of the Human Reference Atlas (HRA)
          in close collaboration with the HuBMAP team and experts from more than 25 other consortia and teams. Users can now query
          and explore 4,807 anatomical structures, 2,215 cell types, and 1,347 biomarkers linked to ontologies (Uberon/FMA, CL,
          and HGNC respectively) across scales. Every six months, a new version of Human Reference Atlas data and code is released
          with user interfaces and APIs that make it possible to visually explore the atlas or programmatically access the data.
          Learn more in our Nature Methods publication entitled “[Human BioMolecular Atlas Program (HuBMAP): 3D Human Reference Atlas construction and usage](https://doi.org/10.1038/s41592-024-02563-5)”.

  - component: PageSection
    tagline: Data
    anchor: data
    level: 2
    content:
      - component: Markdown
        data: |
          The Human Reference Atlas now includes:
            * 36 ASCT+B tables with
              * 4,807 anatomical structures linked to Uberon/FMA
              * 2,215 cell types linked to Cell Ontology (CL)
              * 1,347 biomarkers linked to HGNC
            * 28 functional tissue unit illustrations
            * 1 3D functional tissue unit illustration
            * 85 3D reference objects with 1,473 3D anatomical structures
            * 38 organ mapping antibody panels
            * 10 cell type annotation crosswalks
            * 7 vasculature common coordinate framework (VCCF) tables
            * 12 crosswalk tables from 3D reference objects, functional tissue unit illustrations, and cell type annotation crosswalks to ASCT+B tables

