          - component: PageSection
            tagline: Cell Type Populations for 3D Anatomical Structures of the Human Reference Atlas
            anchor: ctpop-3d-hra
            level: 4
            content:
              - component: Markdown
                data: |
                  The human body contains ~27–37 trillion cells of up to 10,000 cell types (CTs) within a volume of ~62–120 liters
                  (males) and 52–89 liters (females). The Human Reference Atlas (HRA) v2.3 provides a quantitative 3D framework of CTs
                  across 73 reference organs and 1,283 3D anatomical structures (ASs). The HRA Cell Type Population (HRApop) effort
                  has quantified CTs per AS using high-quality single-cell datasets processed through scalable, reproducible workflows
                  and cell type annotation (CTann) tools. HRApop v1.0 includes reference CT populations for 73 ASs (112 when sex-specific)
                  using 662 datasets spatially registered to 230 locations across 17 organs (31 when sex-specific). For 558 single-cell
                  (sc-)transcriptomics datasets (11,042,750 cells), CTs and biomarker expressions were computed using Azimuth, CellTypist,
                  and popV. To test generalizability, 104 sc-proteomics datasets (16,576,863 cells) were integrated. In total,
                  HRApop includes 27,619,613 cells and serves as a healthy reference for researchers aiming to elucidate mechanisms
                  underlying cellular interactions as well as cellular and tissue level disease progression, which may facilitate
                  advancements in basic discovery and lead to new therapeutic strategies.

                  Read in *Nature Scientific Data*: [Cell Type Populations for 3D Anatomical Structures of the Human Reference Atlas](https://doi.org/10.1038/s41597-026-06642-4)
          - component: PageSection
            tagline: A general strategy for generating expert-guided, simplified views of ontologies
            anchor: strategy-for-generating-ontologies
            level: 4
            content:
              - component: Markdown
                data: |
                  Annotation of biomedical entities with widely used, well-structured ontologies and ontology-aware tools
                  ensures data and analyses are Findable, Accessible, Interoperable, and Reusable (FAIR). Standardized
                  terms with synonyms support lexical search, while ontology structure enables biologically meaningful
                  grouping of annotations, such as by location and type. However, ontologies serving diverse communities
                  are often more complex than needed for specific applications, creating barriers to adoption by researchers
                  and resource developers. For example, cell atlases often attempt simplifications by manually building term
                  hierarchies linking to cell type and anatomy ontologies, but these may include relationship types unsuitable
                  for grouping annotations. We present tools for validating human expert curated term hierarchies, developed
                  in two human reference atlas projects, against ontology structures. The tools provide tabular statistics
                  plus graphical views of matching and non-matching terms and relationships to support discussion and conflict
                  resolution. The HuBMAP Human Reference Atlas (HRA) effort is used to validate the approach and tools, and
                  the Human Developmental Cell Atlas is featured as a use case.

                  Read in *Nature Scientific Data*: [A general strategy for generating expert-guided, simplified views of ontologies](https://doi.org/10.1038/s41597-025-06383-w)
          - component: PageSection
            tagline: Vasculature segmentation in 3D hierarchical phase-contrast tomography images of human kidneys
            anchor: vasculature-segmentation-human-kidneys
            level: 4
            content:
              - component: Markdown
                data: |
                  Efficient algorithms are needed to segment vasculature in new 3D medical imaging datasets at scale
                  for research and clinical applications. Manual segmentation of vessels in images is time-consuming
                  and expensive whereas computational approaches have limited accuracy. We organize a global machine
                  learning competition, engaging 1,401 participants, to promote development of deep learning methods
                  for 3D blood vessel segmentation in Hierarchical Phase-Contrast Tomography (HiP-CT) datasets. This
                  paper presents a meta-analysis of the top-performing solutions, focusing on segmentation accuracy
                  and morphological analysis. The competition and subsequent analysis reveal convergent methodological
                  innovations: pseudo-labeling approaches that exploit data distributions, metrics and loss functions
                  that optimize for vessel surface and topology, and multi-scale approaches that handle data heterogeneity.
                  Additionally, the paper presents techniques for building deep learning models for the defined task,
                  metrics to assess and compare algorithm performance, and a dataset with manually annotated and curated
                  gold standard segmentations for future studies in blood vessel segmentation within HiP-CT imaging.

                  The paper is accepted in *Nature Communications*; the preprint is available at *bioRxiv*: [Vasculature segmentation in 3D hierarchical phase-contrast tomography images of human kidneys](https://doi.org/10.1101/2024.08.25.609595)
          - component: PageSection
            tagline: 'CellSAM: a foundation model for cell segmentation'
            anchor: cellsam
            level: 4
            content:
              - component: Markdown
                data: |
                  Cells are a fundamental unit of biological organization, and identifying them in imaging data—cell
                  segmentation—is a critical task for various cellular imaging experiments. Although deep learning
                  methods have led to substantial progress on this problem, most models are specialist models that
                  work well for specific domains but cannot be applied across domains or scale well with large amounts
                  of data. Here we present CellSAM, a universal model for cell segmentation that generalizes across
                  diverse cellular imaging data. CellSAM builds on top of the Segment Anything Model (SAM) by developing
                  a prompt engineering approach for mask generation. We train an object detector, CellFinder, to
                  automatically detect cells and prompt SAM to generate segmentations. We show that this approach allows
                  a single model to achieve human-level performance for segmenting images of mammalian cells, yeast and
                  bacteria collected across various imaging modalities. We show that CellSAM has strong zero-shot
                  performance and can be improved with a few examples via few-shot learning. Additionally, we demonstrate
                  how CellSAM can be applied across diverse bioimage analysis workflows. A deployed version of CellSAM
                  is available at https://cellsam.deepcell.org.

                  Read in *Nature Methods*: [CellSAM: a foundation model for cell segmentation](https://doi.org/10.1038/s41592-025-02879-w)
