    level: 2
    content:
      - component: PageSection
        tagline: '3rd Hackathon: March 9-11, 2026'
        anchor: 3rd-hackathon
        level: 3
        content:
          - component: Markdown
            data: |
              The 3rd HRA Hackathon was held at Indiana University Bloomington from March 9-11, 2026. 14 attendees from Indiana University,
              UConn Health, University of Cincinnati, University of Michigan, The Jackson Laboratory, and the Berlin Institute of Health
              at Charité started work on a new HPO-HRA integration through the use of [HRA lightweight web components](https://apps.humanatlas.io/us6)
              on the [Human Phenotype Ontology (HPO) website](https://hpo.jax.org/) and made progress on integrating the HRA Knowledge Graph
              (KG, see [paper](https://www.nature.com/articles/s41597-025-05183-6)) with the Kidney Tissue Atlas Ontology (KTAO, see
              [website](https://bioportal.bioontology.org/ontologies/KTAO)).

              Learn more about this event: [3rd Human Reference Atlas Hackathon](https://cns-iu.github.io/workshops/2026-03-09_hra_hackathon/)
      - component: PageSection
        tagline: '4th Hackathon: August 3-5, 2026 – All are welcome'
        anchor: 4th-hackathon
        level: 3
        content:
          - component: Markdown
            data: |
              Indiana University is inviting everyone to the 4th HRA Hackathon at Indiana University in Bloomington, IN, August 3-5, 2026.
              This hackathon will bring together Principal Investigators, programmers, and key personnel from teams in the Human BioMolecular
              Atlas Program ([HuBMAP](https://hubmapconsortium.org)), the Cellular Senescence Network ([SenNet](https://sennetconsortium.org/)),
              the Common Fund Data Ecosystem ([CFDE](https://cfde.cloud/)), the Kidney Precision Medicine Project ([KPMP](https://www.kpmp.org/)),
              and the Whole Person Project ([WPP](https://www.nih.gov/news-events/news-releases/nih-launches-landmark-project-whole-person-health-function))
              to discuss the integration of the HRA with other atlassing efforts. Three previously held HRA Hackathons occurred in 2025 and 2026.

              Learn more about this event: [HRA Hackathon for Whole Person Physiome](https://cns-iu.github.io/workshops/2026-08-03_hra_hackathon/)

              Please email Andreas Bueckle ([abueckle@iu.edu](mailto:abueckle@iu.edu)) if interested.
      - component: PageSection
        tagline: '5th Hackathon in Berlin: August 27-28, 2026 – All are welcome'
        anchor: 5th-hackathon
        level: 3
        content:
          - component: Markdown
            data: |
              We are gearing up for our 5th HRA Hackathon from August 27-28, 2026, at the Berlin Institute of Health at Charité in Berlin.
              This hackathon will bring together Principal Investigators, programmers, and key personnel from teams in the Human BioMolecular
              Atlas Program ([HuBMAP](https://hubmapconsortium.org)), the Cellular Senescence Network ([SenNet](https://sennetconsortium.org/)),
              the Common Fund Data Ecosystem ([CFDE](https://cfde.cloud/)), the Kidney Precision Medicine Project ([KPMP](https://www.kpmp.org/)),
              and the Whole Person Project ([WPP](https://www.nih.gov/news-events/news-releases/nih-launches-landmark-project-whole-person-health-function))
              to discuss the integration of the HRA with other atlassing efforts. Over the course of 2 days, we will identify focused coding and
              data projects, set up timelines, and implement minimum viable products (MVPs) and prototypes on site.

              Learn more about this event: [HRA Berlin Hackathon](https://cns-iu.github.io/workshops/2026-08-27_hra_hackathon/)

              Please email Andreas Bueckle ([abueckle@iu.edu](mailto:abueckle@iu.edu)) if interested.

