      - component: PageSection
        tagline: Updated ontologies
        anchor: ontology-updates
        level: 3
        content:
          - component: Markdown
            data: |
              Existing ontologies do not (yet) properly represent healthy anatomical structures and cell types. HuBMAP and other teams are
              actively adding anatomical structure terms and axiom links to Uberon and novel cell types to Cell Ontology (CL) and the Provisional
              Cell Ontology (PCL) and to improve the quality and coverage of these ontologies.
          - component: PageTable
            variant: alternating
            columns:
              - column: ontology
                label: Ontology
              - column: published
                label: Last published release
                type:
                  type: link
                  urlColumn: publishedUrl
              - column: termsAdded
                label: Terms Added
                type:
                  type: numeric
              - column: axiomsAdded
                label: Axioms Added
                type:
                  type: numeric
            rows:
              - ontology: Uberon
                published: 2026-04-01 Release
                publishedUrl: https://github.com/obophenotype/uberon/releases/tag/v2026-04-01
                termsAdded: 289
                axiomsAdded: 289
              - ontology: CL
                published: 2026-06-08 Release
                publishedUrl: https://github.com/obophenotype/cell-ontology/releases/tag/v2026-06-08
                termsAdded: 45
                axiomsAdded: 45
              - ontology: PCL
                published: Release v2025-07-08
                publishedUrl: https://github.com/obophenotype/provisional_cell_ontology/releases/tag/v2025-07-08
                termsAdded: 468
                axiomsAdded: 468
          - component: Markdown
            data: |
              457 TEMP IDs in ASCT+B tables and 125 inexact matches in cell type annotation crosswalks have been replaced by proper CL and Uberon terms since the 10th HRA release.

      - component: PageSection
        tagline: Data mirrors
        anchor: data-mirrors
        level: 3
        content:
          - component: Markdown
            data: |
              The Human Reference Atlas (HRA) is being compiled by more than 1,000 international and interdisciplinary experts across
              more than 25 international consortia funded by the National Institutes of Health (NIH), the Chan Zuckerberg Initiative,
              the CIFAR MacMillan Multiscale Human program in Canada, and Stiftung Charité in Germany. HRA data mirror sites are being
              set up around the globe to make the HRA data and code maximally useful for experts and practitioners.

              * [Berlin](https://humanatlas.bihealth.org/mirror/)
              * [Shanghai](https://msdc.fudan.edu.cn/humanatlas-mirror/)

              Learn more: [Standard Operating Procedure | Setting Up a Mirror Site for the Human Reference Atlas](https://doi.org/10.5281/zenodo.17873664)

