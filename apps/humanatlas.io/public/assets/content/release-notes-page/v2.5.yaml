      - component: PageSection
        tagline: 'New code: Human Reference Atlas Time Capsule'
        anchor: new-code-hra-time-capsule
        level: 3
        content:
          - component: Markdown
            data: |
              The Human Reference Atlas (HRA) Time Capsule is a downloadable, citable snapshot of the HRA Knowledge Graph
              that preserves each release for long-term access and use. Developers can use it to create local installations,
              mirror sites, and custom deployments without depending on external infrastructure.
          - component: TextHyperlink
            text: Get code
            url: https://doi.org/10.5281/zenodo.15323983
            icon: arrow_right_alt

      - component: PageSection
        tagline: 'New feature: The Cell Distance Explorer’s Spatial Omics Gallery is live!'
        anchor: new-feature-cde-spatial-omics-gallery
        level: 3
        content:
          - component: Image
            src: assets/content/release-notes-page/images/v2.5/spatial-omnics.png
            alt: A screenshot of the Cell Distance Explorer application showing a colorful custom network visualization.
          - component: Markdown
            data: |
              The [Spatial Omics Gallery](https://apps.humanatlas.io/cde/gallery) offers a curated collection of
              cell-to-nearest-endothelial-cell distance distributions derived from single-cell spatial omics datasets—spanning
              both spatial proteomics and spatial transcriptomics—collected and processed by the Human Reference Atlas team.
              Researchers can now explore distance distributions across various cell types using 399 spatially resolved omics
              datasets drawn from 14 studies, covering 12 tissue types and encompassing over 47 million cells. Whether you are
              investigating tissue microenvironments, benchmarking cell proximity patterns, or seeking reference distributions
              for your own spatial data, the Spatial Omics Gallery provides a rich, readily accessible resource.
          - component: TextHyperlink
            text: Use app
            url: https://apps.humanatlas.io/cde/gallery
            icon: arrow_right_alt

  - component: PageSection
