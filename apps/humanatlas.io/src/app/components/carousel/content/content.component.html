<img class="image" alt="" [src]="item().imageSrc | assetUrl" />

<div class="info" hraFeature="content">
  <div class="tagline">{{ item().tagline }}</div>
  <div class="description">{{ item().description }}</div>

  @if (getLinkType(item()) === 'url') {
    <a
      mat-button
      hraCtaButton
      class="action"
      target="_blank"
      hraFeature="carousel-external-link"
      hraClickEvent
      [href]="getLink(item())"
    >
      {{ item().action }}<span class="cdk-visually-hidden"> {{ item().description }} (opens in a new tab)</span>
      <mat-icon iconPositionEnd>arrow_right_alt</mat-icon>
    </a>
  } @else {
    <a mat-button hraCtaButton class="action" hraFeature="action" hraClickEvent [routerLink]="getLink(item())">
      {{ item().action }}<span class="cdk-visually-hidden"> {{ item().description }}</span>
      <mat-icon iconPositionEnd>arrow_right_alt</mat-icon>
    </a>
  }
</div>
