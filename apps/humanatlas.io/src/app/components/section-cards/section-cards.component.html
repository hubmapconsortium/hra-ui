<h2 class="section-title">Explore the Human Reference Atlas</h2>

<hra-grid-container class="cards" hraFeature="section-cards">
  @for (card of cardInfo(); track card) {
    @if (card.url; as url) {
      <hra-action-card
        variant="outlined-with-icons"
        [tagline]="card.tagline"
        [icons]="[card.icon]"
        [hraFeature]="card.tagline | slugify"
      >
        <hra-action-card-action>
          <a hraHyperlink target="_blank" [attr.href]="card.url"
            >{{ card.action }}<span class="cdk-visually-hidden"> ({{ card.tagline }}, opens in a new tab)</span></a
          >
        </hra-action-card-action>
      </hra-action-card>
    } @else {
      <hra-action-card
        variant="outlined-with-icons"
        [tagline]="card.tagline"
        [icons]="[card.icon]"
        [hraFeature]="card.tagline | slugify"
      >
        <hra-action-card-action>
          <a hraHyperlink [routerLink]="card.route"
            >{{ card.action }}<span class="cdk-visually-hidden"> ({{ card.tagline }})</span></a
          >
        </hra-action-card-action>
      </hra-action-card>
    }
  }
</hra-grid-container>
