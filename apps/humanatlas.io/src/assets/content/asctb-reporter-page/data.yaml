$schema: ../../../app/schemas/content-page/content-page.schema.json
title: ASCT+B Reporter
subtitle: Construct, explore, and compare data visually.
icons: product:asctb-reporter

headerContent:
  - component: FlexContainer
    content:
      - component: Button
        label: Use app
        href: 'https://apps.humanatlas.io/asctb-reporter/'
        type: cta

content:
  - component: PageSection
    tagline: Overview
    anchor: overview
    level: 2
    content:
      - component: Markdown
        data: |
          Anatomical structures, cell types, and biomarker (ASCT+B) tables aim to capture the nested part_of structure of human organ systems from gross anatomical structure scale to subcellular biomarker scale.

          Functional tissue units (FTUs) for an organ system are identified as well as the typology of cells and biomarkers used to uniquely identify cell types within that organ system (e.g., gene, protein, proteoforms, lipid or metabolic markers). Ontology terms and unique identifiers are matched to AS, CT, and B wherever possible for semantic search capability within Human Reference Atlas apps.

          This data is authored and reviewed by an international team of anatomists, pathologists, physicians, and other experts and it is used to develop a common coordinate framework (CCF) of the healthy human body. The ASCT+B Reporter is a visualization app to explore, compare, and construct Human Reference Atlas digital objects ASCT+B tables and organ mapping antibody panels (OMAPs).

          This app includes a partonomy tree that presents relationships between various anatomical structures and substructures, that are linked to their respective cell types and biomarkers via bimodal networks. This app also presents an indented list view of the partonomy tree and lists statistics for various metadata (e.g., counts of ASCT+B table entity types and relationship types) which are downloadable. The debug log lists any issues related to the data provided in the table.

          This app has a backend server, the ASCT+B API, to retrieve the data from Google Sheets and convert it to a machine-readable format.

  - component: PageSection
    tagline: App features
    anchor: app-features
    level: 3
    content:
      - component: Image
        src: assets/ui-images/annotated-ui-asctb-reporter.png

  - component: PageSection
    tagline: App guide
    anchor: app-guide
    level: 2
    content: []

  - component: PageSection
    tagline: Demo video
    anchor: demo-video
    level: 3
    content:
      - component: YouTubePlayer
        videoId: pzUFmDhQEO8
        label: Asct+b reporter application demo video

  - component: PageSection
    tagline: Comparing datasets
    anchor: comparing-datasets
    level: 3
    content:
      - component: Markdown
        data: |
          The ASCT+B Reporter includes a feature for comparing uploaded data with official ASCT+B tables.

          To use this feature, data must be entered into the ASCT+B table Google Sheets template and made publicly accessible so it can be uploaded into the Reporter. **Note:** `.xls` files are not supported. This feature is especially useful for comparing research data with the data in the ASCT+B Master Tables.

          The ASCT+B Reporter app supports comparing:
          - ASCT+B tables to ASCT+B tables
          - ASCT+B tables to experimental data
          - ASCT+B tables to organ mapping antibody panel tables

  - component: PageSection
    tagline: How to add data for comparison
    anchor: how-to-add-data-for-comparison
    level: 4
    content:
      - component: Markdown
        data: |
          1. In the ASCT+B Reporter application, click the `Compare` button in top toolbar to open the Compare side panel.
          2. Use templates to format data into an ASCT+B table or an OMAP Compare table.
          3. Add data to compare in two ways:
             1. Upload an ASCT+B table or OMAP Compare table CSV or XLSX,
             2. Add the URL of a publicly accessible Google Sheet.
          4. Optional: Add a title and description for the dataset.
          5. Optional: Select a color for visualizing the data.
          6. Optional: Add more datasets by clicking the `Add` button, then repeat step 1 and step 2 for each additional dataset.
          7. Click the `Compare` button to generate the visualization to start comparing.

  - component: PageSection
    tagline: How to make a Google Sheet publicly accessible
    anchor: how-to-make-a-google-sheet-publicly-accessible
    level: 4
    content:
      - component: Markdown
        data: |
          1. Locate and open the Google Sheet for comparison.
          2. Click the `Share` button in the top right toolbar.
          3. The Share modal is now visible > Locate the General Access section.
          4. In the General Access dropdown, select “Anyone with the link”.
          5. In the General Access area, select “Viewer” permissions.
          6. Click the `Done` button.

  - component: PageSection
    tagline: Explore and test data in Playground
    anchor: playground
    level: 3
    content:
      - component: Markdown
        data: |
          The **Playground** feature provides a space to explore a sample visualization, upload custom data, and edit table content to see updates in real time. Uploaded or linked data is temporary and is cleared when the page is refreshed.

          1. In the top toolbar, select **Playground**.
          2. Review the sample visualization that opens. Playground loads an example dataset for testing and exploration.
          3. Select the **Visualization** tab to view the current data as a visualization. This is the default view.
          4. Select the **Table** tab to review the data in table format. This view supports quick edits. For larger updates, edit the source data in Google Sheets and refresh the data in the Reporter.
          5. Select the **Upload** tab to add custom data. Paste a Google Sheet or CSV URL, then select **Link** to visualize the data. A file can also be added using the **Upload attachments** icon.
          6. Verify that the Google Sheet has public access. Public access is required for Playground to load linked data correctly.
          7. Paste the Google Sheet URL from the browser address bar.
          8. Confirm that the data uses the required [ASCT+B table template format](https://docs.google.com/spreadsheets/d/1tK916JyG5ZSXW_cXfsyZnzXfjyoN-8B2GXLbYD6_vF0/edit#gid=559906129).

  - component: PageSection
    tagline: View statistics report
    anchor: statistics-report
    level: 3
    content:
      - component: Markdown
        data: |
          The **statistics report** feature summarizes data from the current organ sheet. Values update based on the filters applied in the Reporter, including biomarker filters such as genes and proteins. Statistics can be downloaded as Excel files.

          1. In the top navigation bar, click the `View statistics` bar graph icon button to generate and open the statistics report.
          2. Review the statistics panel that opens on the right.
          3. To download the report as an Excel file, select **Download** at the top of the panel. If multiple compare sheets are loaded, each one is included as a separate sheet in the workbook.

  - component: PageSection
    tagline: Main sheet tab
    anchor: main-sheet-tab
    level: 4
    content:
      - component: Markdown
        data: |
          The **Main sheet** tab includes ASCT+B table statistics for the selected organ.

          1. Review **Unique Entities** to see unique counts for anatomical structures (AS), cell types (CT), and biomarkers (B).
          2. Review **Entity Links** to see counts for relationships between entities, including: `part_of`, `located_in`, and `characterizes`
          3. Review **Ontology Links** to see separate graphs showing how many structures have ontology IDs and how many do not.
          4. Expand **Alphabetical listings of AS, CT, and B** to view the names of the entities included in the counts above.
          5. Review **Counts by Organ and Biomarker Type** for additional count summaries.
             - When a **single organ** is selected, biomarker counts appear in an expandable biomarker type section.
             - When **multiple organs** are selected, counts appear in a table that includes AS, CT, B, and related tree and bimodal links.

          How counts are calculated:
          1. **Counts**: Anatomical structure (AS) and cell type (CT) counts are based on unique ontology ID entities in the official ASCT+B table. If an ontology ID is not available, the entity name is used instead.
          2. **Tree links and bimodal links**: Tree link counts represent AS-to-AS relationships. Bimodal link counts represent AS-to-CT and CT-to-B relationships. These counts are based on the number of connected nodes and edges in the table data.
          3. **Biomarker Counts**: Biomarker counts for proteins (BP), genes (BG), metabolites (BM), lipids (BL), and proteoforms (BF) are based on unique biomarker ID entities together with biomarker type. If an ID is not available, the entity name and biomarker type are used instead.

  - component: PageSection
    tagline: Compare tab
    anchor: compare-tab
    level: 4
    content:
      - component: Markdown
        data: |
          Each compare sheet includes its own report:
          1. Use the **Compare** feature to upload or link custom data.
          2. Open **Report** to view a report for each compare sheet.
          3. Download or delete compare sheet reports as needed.
