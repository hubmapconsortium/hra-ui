$schema: ../../../app/schemas/content-page/content-page.schema.json
title: Training
subtitle: Build the skills to explore, use, and understand the Human Reference Atlas.
icons: misc:training
content:
  - component: PageSection
    tagline: Standard operating procedures (SOPs)
    anchor: sops
    level: 2
    content:
      component: Markdown
      data: |
        Processes and procedures to ensure the standardized construction of the Human Reference Atlas (HRA).

        - [Standard Operating Procedures](standard-operating-procedures)
        - [Standard Operating Procedure Glossary](https://doi.org/10.5281/zenodo.17664992)

  - component: PageSection
    tagline: Introduction to the Human Reference Atlas
    anchor: introduction
    level: 2
    content:
      component: Markdown
      data: Introductory level content made for general audiences.

  - component: PageSection
    tagline: Human Atlas Stories
    anchor: human-atlas-stories
    level: 3
    content:
      component: Markdown
      data: |
        Mixed-media animated essays designed to introduce the HRA to a general audience.

        1. [What is a Human Reference Atlas?](https://cns-iu.github.io/hra-scrollytelling/story1.html)
        2. [Squiggy's Identity Crisis](https://cns-iu.github.io/hra-scrollytelling/story2.html)
        3. [Something's NOT Registering!](https://cns-iu.github.io/hra-scrollytelling/story3.html)
        4. [Data Detangle](https://cns-iu.github.io/hra-scrollytelling/story4.html)
        5. [Know Your Body Buddies](https://cns-iu.github.io/hra-scrollytelling/story5.html)

  - component: PageSection
    tagline: Videos
    anchor: human-atlas-videos
    level: 3
    content:
      component: Markdown
      data: |
        Learn key HRA concepts through short videos, animations, and real-world research examples.

  - component: PageSection
    tagline: HuBMAP Overview
    anchor: hubmap-overview
    level: 4
    content:
      - component: Markdown
        data: |
          The [Human BioMolecular Atlas Program (HuBMAP)](https://hubmapconsortium.org), a National Institutes of Health (NIH) Common Fund program, is a leading contributor to the development of the Human Reference Atlas (HRA), working with experts across multiple consortia to build a comprehensive 3D map of the healthy human body.

      - component: YouTubePlayer
        videoId: yCh4XnD7rEE
        label: HuBMAP Overview

  - component: PageSection
    tagline: Vasculature Common Coordinate Framework
    anchor: vccf
    level: 4
    content:
      - component: Markdown
        data: |
          The Vasculature Common Coordinate Framework (VCCF) is an open resource that maps the body's blood vessels and how they connect. It links blood vessels to related cells, biomarkers, anatomical structures, and 3D reference objects, helping researchers study, compare, and describe locations in the human body.

          Get data and learn more: [Vasculature Common Coordinate Framework (VCCF)](https://humanatlas.io/vccf)

      - component: YouTubePlayer
        videoId: zQeMgxo8n_U
        label: 'Human Reference Atlas: Vasculature Common Coordinate Framework (VCCF)'

  - component: PageSection
    tagline: Define Yourself—The Human Gut Atlas Story
    anchor: human-gut-atlas-story
    level: 4
    content:
      - component: Markdown
        data: |
          See how researchers use HRA data to uncover patterns in cell organization within the human gut. This video shows how mapping cell neighborhoods can reveal new insights into human health and disease.

      - component: YouTubePlayer
        videoId: _H3S5HeFFPE
        label: 'Human Reference Atlas: Define Yourself—The Human Gut Atlas Story'

  - component: PageSection
    tagline: 10^10 — A Multiscale Voyage through the Human Body
    anchor: multiscale-voyage
    level: 4
    content:
      - component: Markdown
        data: |
          Take a journey through the human body, from organs and tissues to cells and molecules. This animation showcases how the HRA maps the body across multiple scales.

      - component: YouTubePlayer
        videoId: -YNP5XdnLPA
        label: '10^10 — A Multiscale Voyage through the Human Body'

  - component: PageSection
    tagline: 24 Hour Events
    anchor: 24-hour-events
    level: 3
    content:
      component: Markdown
      data: |
        Scholars and practitioners present and discuss their work in a fun and accessible style over the course of 24 hours.

        - [Multiscale Human 2024](https://humanatlas.io/events/2024-24h/)
        - [Human Reference Atlas 2022](https://humanatlas.io/events/2022-24h/)

  - component: PageSection
    tagline: Visible Human Course
    anchor: visible-human-course
    level: 3
    content:
      component: Markdown
      data: |
        Ready to dive deeper? Enroll in the free [Visible Human Course](https://expand.iu.edu/browse/sice/cns/courses/visible-human-mooc) to learn how HuBMAP and the Human Reference Atlas are transforming our understanding of the human body.

  - component: PageSection
    tagline: Kaggle competitions
    anchor: kaggle-competitions
    level: 2
    content:
      component: Markdown
      data: |
        Algorithm development challenges that engage teams from around the globe to develop code for Human Reference Atlas construction.

        1. [Hacking the Kidney by HuBMAP](https://humanatlas.io/kaggle-one)
        2. [Hacking the Human Body by HuBMAP and HPA](https://humanatlas.io/kaggle-two)
        3. [Hacking the Human Vasculature by HuBMAP](https://humanatlas.io/kaggle-three)
        4. [Hacking the Human Vasculature in 3D](https://humanatlas.io/kaggle-four)

  - component: PageSection
    tagline: Previews
    anchor: previews
    level: 2
    content:
      component: Markdown
      data: |
        Previews showcase pilot and example functionality of current and former Human Reference Atlas projects.

        - [ASCT+B Reporter Comparison](https://hubmapconsortium.github.io/hra-previews/pilots/pilot1.html)
        - [ASCT+B Cell-Types Data from Azimuth Reference Data with Summaries](asctb-azimuth)
        - [CCF Tissue Block Annotation: Mesh-Level Collision Detection](https://hubmapconsortium.github.io/hra-previews/pilots/pilot7.html)
        - [Cell Population Graphs](/cell-population-graphs)
        - [Common Coordinate Framework Ontology](https://humanatlas.io/ccf-ontology)
        - [Comparing Tabula Sapiens to the Human Reference Atlas](https://hubmapconsortium.github.io/hra-previews/pilots/pilot5.html)
        - [Explore Biomarker Expressions for Cell Types](https://humanatlas.io/user-story/3)
        - [Functional Tissue Unit Segmentation](https://hubmapconsortium.github.io/hra-previews/pilots/pilot6.html)
        - [HRA vs. Experimental Data](https://hubmapconsortium.github.io/hra-previews/pilots/pilot3.html)
        - [Human Atlas Stories](https://hubmapconsortium.github.io/hra-previews/pilots/pilot4.html)
        - [Vasculature CCF Visualization](https://hubmapconsortium.github.io/hra-previews/pilots/pilot2.html)
