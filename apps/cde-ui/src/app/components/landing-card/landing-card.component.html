@let data = card();

<a
  class="card"
  hraFeature="primary-action"
  [hraClickEvent]="{ url: data.action.url }"
  [hraLink]="data.action.url"
  [hraLinkExternal]="data.action.external"
>
  <div class="icon-container">
    <hra-icon class="icon" inline [icon]="data.icon" />
  </div>

  <div class="body">
    <h3 class="title">{{ data.title }}</h3>

    @if (data.description) {
      <p class="description">{{ data.description }}</p>
    }
  </div>

  <div class="actions">
    <span class="cta" aria-hidden="true">
      {{ data.action.label }}
      <mat-icon class="cta-icon">{{ data.action.external ? 'open_in_new' : 'arrow_right_alt' }}</mat-icon>
    </span>
  </div>
</a>
