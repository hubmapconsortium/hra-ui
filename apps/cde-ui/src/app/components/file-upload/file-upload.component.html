<ng-container hraFeature="file-upload">
  @if (!file && errorMessage()) {
    <hra-error-indicator announce icon="warning" [errors]="[errorMessage(), errorActionMessage()]" />
  }

  <!-- Upload or delete, followed by any buttons the page adds, such as a template link -->
  <div class="actions">
    @if (file && !errorMessage()) {
      <hra-delete-file-button hraFeature="delete" hraClickEvent [fileName]="file.name" (cancelLoad)="cancelLoad()" />
    } @else {
      <button
        mat-flat-button
        class="upload"
        hraFeature="upload"
        hraClickEvent
        [attr.aria-label]="uploadAriaLabel() ?? null"
        (click)="fileInput.click()"
        #uploadButton
      >
        Upload CSV
      </button>
      <input
        type="file"
        style="display: none"
        name="fileInput"
        data-testid="file-upload"
        [attr.accept]="accept()"
        (change)="load(fileInput)"
        #fileInput
      />
    }
    <ng-content />
  </div>
</ng-container>
