<ng-container hraFeature="cde-ui">
  <hra-header hraFeature="header" [breadcrumbs]="crumbs()">
    <a
      mat-icon-button
      hraLink="/create"
      hraPlainTooltip="Upload and visualize data"
      hraFeature="upload-data"
      hraClickEvent
    >
      <mat-icon>upload</mat-icon>
    </a>
    <a
      mat-icon-button
      hraLink="/gallery"
      hraPlainTooltip="Spatial Omics Gallery"
      hraFeature="omics-gallery"
      hraClickEvent
    >
      <mat-icon>cards</mat-icon>
    </a>
    <a
      mat-icon-button
      rel="noopener noreferrer"
      hraPlainTooltip="Explore example data"
      hraFeature="explore-menu"
      hraClickEvent
      [matMenuTriggerFor]="exploreMenu"
    >
      <mat-icon>explore</mat-icon>
    </a>
    <button
      mat-icon-button
      aria-label="Theme"
      hraPlainTooltip="Choose a light or dark theme"
      hraFeature="theme"
      hraClickEvent
      [matMenuTriggerFor]="themeMenu"
    >
      <mat-icon>{{ themeIcon() }}</mat-icon>
    </button>

    <hra-help-button action="https://humanatlas.io/user-story/5" />

    <mat-menu hraFeature="theme-menu" #themeMenu>
      @for (option of themeOptions; track option.id) {
        @let checked = themeService.preference() === option.id;
        <button
          mat-menu-item
          role="menuitemradio"
          hraClickEvent
          [hraFeature]="option.id"
          [attr.aria-checked]="checked"
          (click)="themeService.setPreference(option.id)"
        >
          <mat-icon>{{ checked ? 'radio_button_checked' : 'radio_button_unchecked' }}</mat-icon>
          {{ option.label }}
        </button>
      }
    </mat-menu>

    <!-- Explore example data Menu -->
    <mat-menu class="more-menu" hraFeature="explore-menu" #exploreMenu>
      <a class="option" mat-menu-item hraLink="/example/0" hraLinkExternal hraFeature="2d-intestine-data" hraClickEvent>
        <div class="option-text">
          <div class="option-name">Large intestine (2D)</div>
          <div class="option-description">CyCIF data by Sorger Lab at Harvard Medical School</div>
        </div>
      </a>
      <mat-divider />
      <a class="option" mat-menu-item hraLink="/example/1" hraLinkExternal hraFeature="3d-skin-data" hraClickEvent>
        <div class="option-text">
          <div class="option-name">Skin (3D)</div>
          <div class="option-description">
            Cell DIVE data by Fiona Ginty Lab at GE HealthCare Technology and Innovation Center
          </div>
        </div>
      </a>
    </mat-menu>
  </hra-header>

  <router-outlet (activate)="outletChanged.notify()" (attach)="outletChanged.notify()" />
</ng-container>
