<ng-container hraFeature="cde-ui">
  <hra-header hraFeature="header" navigationPosition="start">
    <a
      mat-icon-button
      hraHeaderActions
      hraLink="/create"
      hraPlainTooltip="Upload and visualize data"
      hraFeature="upload-data"
      hraClickEvent
    >
      <mat-icon>upload</mat-icon>
    </a>
    <button
      mat-icon-button
      hraHeaderActions
      aria-label="Theme"
      hraPlainTooltip="Choose a light or dark theme"
      hraFeature="theme"
      hraClickEvent
      [matMenuTriggerFor]="themeMenu"
    >
      <mat-icon>{{ themeIcon() }}</mat-icon>
    </button>
    <hra-help-button hraHeaderActions hraFeature="help" [action]="helpMenu" />
  </hra-header>

  <mat-menu hraFeature="theme-menu" #themeMenu>
    @for (option of themeOptions; track option.id) {
      @let checked = themeService.preference() === option.id;
      <button
        mat-menu-item
        role="menuitemradio"
        hraClickEvent
        [hraFeature]="option.id"
        [attr.aria-checked]="checked"
        (click)="themeService.setPreference(option.id)"
      >
        <mat-icon>{{ checked ? 'radio_button_checked' : 'radio_button_unchecked' }}</mat-icon>
        {{ option.label }}
      </button>
    }
  </mat-menu>

  <mat-menu hraFeature="help-menu" #helpMenu="matMenu">
    @for (link of helpLinks; track link.id) {
      <a
        mat-menu-item
        target="_blank"
        rel="noopener noreferrer"
        hraClickEvent
        [hraFeature]="link.id"
        [attr.href]="link.url"
      >
        <mat-icon>open_in_new</mat-icon>
        {{ link.label }}
      </a>
    }
  </mat-menu>

  <router-outlet />
</ng-container>
