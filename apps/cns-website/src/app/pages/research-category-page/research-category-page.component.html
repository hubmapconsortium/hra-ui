<div class="container" id="main-content" role="main" tabindex="-1" hraFeature="research-category-page">
  <hra-search-filter
    hraFeature="search"
    label="Search"
    separator="/"
    [totalCount]="items().length"
    [viewingCount]="filteredItems().length"
    [search]="search() ?? ''"
    (searchChange)="search.set($event || null)"
  />

  <ng-scrollbar>
    <div class="content" hraFeature="result">
      <hra-page-label class="title" [tagline]="title()" />

      @if (filteredItems().length === 0) {
        <hra-no-results-indicator hraFeature="no-results" (clearFilters)="search.set(null)" />
      } @else if (view() === 'gallery') {
        @for (group of groups(); track group.label) {
          <section class="gallery-group" [hraFeature]="group.label">
            <h3 hra-section-link underlined class="group-title">{{ group.label }}</h3>

            <hra-gallery-grid [dataSource]="group.items">
              <hra-gallery-card
                *hraGalleryGridItem="let item"
                [hraFeature]="item.slug"
                [imageSrc]="getThumbnail(item)"
                [tagline]="item.title"
                [date]="(item.dateStart | date) ?? ''"
                [link]="item.link"
                [external]="true"
                [tags]="getTagItems(item.category, item.projects)"
              />
            </hra-gallery-grid>
          </section>
        }
      } @else {
        <hra-list-view [data]="listGroups()" [groupBy]="true" />
      }

      <div class="page-end">
        <mat-divider />
        <hra-end-of-results-indicator [count]="filteredItems().length" />
      </div>

      <cns-footer />
    </div>
  </ng-scrollbar>
</div>
