@for (item of flattenedMenuItems(); track item) {
  <a
    mat-button
    hraSecondaryButton
    hraClickEvent
    class="item-label"
    tabindex="0"
    [hraFeature]="item.label | slugify"
    [hraLink]="item.url"
    [hraLinkExternal]="item.external"
    (click)="maybeScrollToTop(item)"
    (keyup.enter)="maybeScrollToTop(item)"
  >
    {{ item.label }}
  </a>
}
