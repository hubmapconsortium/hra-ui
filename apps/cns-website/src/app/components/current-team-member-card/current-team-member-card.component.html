<hra-profile-card
  [pictureUrl]="pictureUrl()"
  [name]="person().name"
  [description]="occupation()"
  [centerContent]="true"
>
  @if (showLearnMore()) {
    <a
      mat-button
      hraHyperlink
      class="learn-more"
      [hraLink]="`/people/${person().slug}`"
      [attr.aria-label]="`Learn more about ${person().name}`"
    >
      Learn more
      <mat-icon iconPositionEnd>arrow_right_alt</mat-icon>
    </a>
  }
</hra-profile-card>
