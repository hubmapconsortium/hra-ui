<img loading="lazy" [attr.src]="pictureUrl() | assetUrl" [attr.alt]="`Profile picture of ${name()}`" />
<div class="details">
  <div class="name">{{ name() }}</div>
  <div class="occupation">{{ occupation() }}</div>
  <div class="date-ranges" role="list" aria-label="CNS tenure">
    @for (dateRange of dateRanges(); track $index) {
      <div class="date-range" role="listitem">{{ dateRange }}</div>
    }
  </div>
</div>
