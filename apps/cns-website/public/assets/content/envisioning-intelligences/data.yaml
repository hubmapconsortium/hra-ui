  - component: PageSection
    tagline: Zoonotic Web, 2024
    anchor: zoonotic-web
    level: 2
    content:
      - component: Image
        src: /assets/content/envisioning-intelligences/images/zoonotic-web.png
      - component: PageSection
        tagline: Artists and affiliations
        level: 3
        content:
          - component: Markdown
            data: |
              - Liuhuaying Yang, Complexity Science Hub
              - Amélie Desvars-Larrive, Complexity Science Hub and University of Veterinary Medicine Vienna
      - component: PageSection
        tagline: Description
        level: 3
        content:
          - component: Markdown
            data: |
              A rat carrying a virus is bitten by a tick. That now-infected tick bites a cow on a farm. A farmer slaughters the cow
              and processes the meat for human consumption. The path taken by zoonoses—infectious diseases that spread from animal
              to human—can be anything but straightforward, making them difficult to fully track, study, and prevent.

              This interactive network shows how tiny pathogens navigate between species and environments. Visualizing otherwise hidden
              relationships reveals how microscopic and macroscopic life co-shape disease dynamics.
      - component: PageSection
        tagline: References
        level: 3
        content:
          - component: Markdown
            data: |
              - Amélie Desvars-Larrive, Amélie, Anna Elisabeth Vogl, Gavrila Amadea Puspitarani, Liuhuaying Yang, Anja Joachim, and Annemarie Käsbohrer. 2024.
              “A One Health Framework for Exploring Zoonotic Interactions Demonstrated through a Case Study.” *Nature Communications* 15 (5650). Accessed February 20, 2026.
              https://www.nature.com/articles/s41467-024-49967-7.
              - Yang, Liuhuaying, and Amélie Desvars-Larrive. 2024. “Zoonotic Web.” *Nature Communications* 15 (5650). Accessed February 23, 2026. https://vis.csh.ac.at/zoonotic-web.
