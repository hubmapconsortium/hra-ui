content:
  - component: PageSection
    tagline: The Knowledge Cosmos, 2025
    anchor: the-knowledge-cosmos
    level: 2
    content:
      - component: Image
        src: /assets/content/envisioning-intelligences/images/knowledge-cosmos.png
      - component: PageSection
        tagline: Artists and affiliations
        level: 3
        content:
          - component: Markdown
            data: |
              - Nikita Sridhar, IBM Client Engineering
              - Alec McGail, NASA
              - Rifaa Tajani, Harvard University and IBM
              - Jiabao Li, The University of Texas at Austin
      - component: PageSection
        tagline: Description
        level: 3
        content:
          - component: Markdown
            data: |
              The amount of scientific literature humanity produces is growing at an incredible rate, and it is difficult to stay current.
              To make knowledge more manageable, it is often divided into disciplinary territories. But this solution prevents knowledge
              from crossing borders to encounter the unfamiliar thoughts and practices that may spur new ideas and innovation.

              *The Knowledge Cosmos* visualization is an interactive 3D universe where 17 million academic papers are located based on
              similarity of content, not preconceived categories. This arrangement allows for the discovery of unexpected interdisciplinary
              connections and under-explored gaps in knowledge.
