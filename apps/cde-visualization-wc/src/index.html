<!doctype html>
<html lang="en">
  <head>
    <!-- Regular metadata. Customize as you see fit -->
    <meta charset="utf-8" />
    <title>CDE Visualization</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const cde = document.querySelector('#cde');

        // Set data from javascript. Matches cde-ui's CRC01002 example: sampleExtra adds the source links and
        // hides the placeholder creation date and time.
        cde.metadata = {
          title: 'colon-cycif-sorgerlab / CRC01002',
          organ: 'Large Intestine',
          technology: 'CyCIF',
          thickness: 5,
          pixelSize: 0.65,
          creationTimestamp: 1710399803000,
          sourceFileName: '2D Large Intestine Sample',
          sampleExtra: {
            type: '2D',
            organ: 'Large Intestine',
            sampleUrl: 'https://doi.org/10.1016/j.cell.2022.12.028',
            sourceDataUrl:
              'https://docs.google.com/spreadsheets/d/1oy8U8ot7DX8ZZ2M8tz07EUHEbgzy5i2rmr09g5BrRmg/edit?gid=631939841#gid=631939841',
          },
        };

        // Listen to events
        cde.addEventListener('nodeClick', (event) => {
          console.log('Node clicked: ', event.detail);
        });
      });
    </script>
  </head>
  <body style="height: 100vh">
    <cde-visualization
      id="cde"
      nodes="https://cdn.humanatlas.io/image-store/vccf-data-cell-nodes/published/colon-cycif-sorgerlab/CRC01002-nodes.csv"
      edges="https://cdn.humanatlas.io/image-store/vccf-data-cell-nodes/published/colon-cycif-sorgerlab/CRC01002-edges.csv"
    >
    </cde-visualization>
  </body>
</html>
