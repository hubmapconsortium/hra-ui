$schema: ../../../../src/app/schemas/content-page/content-page.schema.json
title: Visual Assets
subtitle: |
  Open-source visual assets for the Human Reference Atlas.
icons: product:design-system
content:
  - component: PageSection
    tagline: Using HRA visual assets
    anchor: using-visual-assets
    level: 2
    content:
      - component: Markdown
        data: |
          Human Reference Atlas (HRA) visual assets, such as icons, logos, and illustrations, are open-source and available for use in your own projects. We ask that you follow the [HRA Design Style Guide](https://doi.org/10.5281/zenodo.14343078) when using HRA visual assets to maintain consistency with the HRA brand.

  - component: PageSection
    tagline: Iconography
    anchor: iconography
    level: 2
    content:
      - component: Markdown
        data: |
          HRA icons are a key part of our design language and are used across all interfaces. HRA has custom icons for apps, data, organs, and more.

      - component: Image
        src: assets\content\visual-assets-page\images\icon-overview.png
        alt: 'Overview of HRA icon categories: app products, data products, organs, and miscellaneous icons.'

      - component: Markdown
        data: |
          Optimal usage of HRA iconography includes:
            - All icons contain a filled, circular background. Do not use HRA icons with outlines or strokes.
            - App and data product icons exist as a branded house.
              - Use a white fill (<code>#FFFFFF</code>) on dark blue (<code>#201E3D</code>).
            - Organ icons use a white fill (<code>#FFFFFF</code>) on brand red (<code>#FF0043</code>).
            - Miscellaneous icons use a white fill (<code>#FFFFFF</code>) on top of tertiary blue (<code>#4B4B5E</code>).

  - component: PageSection
    tagline: Download icon packages
    anchor: download-icons
    level: 3
    content:
      - component: Markdown
        data: |
          Download HRA icon packages for use in your own projects. ZIP files contain all icons for a given category in SVG and PNG formats. For more information, see the [HRA Design Style Guide](https://doi.org/10.5281/zenodo.14343078).

      - component: GridContainer
        content:
          - component: ActionCard
            variant: outlined-with-icons
            tagline: App icons
            icons: product:apps
            content:
              - component: Markdown
                data: ZIP files contain all HRA app icons in PNG and SVG formats.
            actionsLeft:
              component: TextHyperlink
              text: PNG
              url: https://humanatlas.io/api
            actionsRight:
              component: TextHyperlink
              text: SVG
              url: assets/content/visual-assets-page/downloads/app-svg.zip
              download: ''
          - component: ActionCard
            variant: outlined-with-icons
            tagline: Data product icons
            icons: product:ftu
            content:
              - component: Markdown
                data: ZIP files contain all HRA data product icons in PNG and SVG formats.
            actionsLeft:
              component: TextHyperlink
              text: PNG
              url: https://humanatlas.io/asctb-reporter
            actionsRight:
              component: TextHyperlink
              text: SVG
              url: https://humanatlas.io/asctb-reporter
          - component: ActionCard
            variant: outlined-with-icons
            tagline: Organ icons
            icons: organ:heart
            content:
              - component: Markdown
                data: ZIP files contain all HRA organ icons in PNG and SVG formats.
            actionsLeft:
              component: TextHyperlink
              text: PNG
              url: https://humanatlas.io/organ
            actionsRight:
              component: TextHyperlink
              text: SVG
              url: https://humanatlas.io/user-story/5
          - component: ActionCard
            variant: outlined-with-icons
            tagline: Miscellaneous icons
            icons: misc:experts
            content:
              - component: Markdown
                data: ZIP files contain all HRA miscellaneous icons in PNG and SVG formats.
            actionsLeft:
              component: TextHyperlink
              text: PNG
              url: https://humanatlas.io/organ
            actionsRight:
              component: TextHyperlink
              text: SVG
              url: https://humanatlas.io/user-story/5

  - component: PageSection
    tagline: Logos
    anchor: logos
    level: 2
    content:
      - component: Markdown
        data: |
          Content here.
