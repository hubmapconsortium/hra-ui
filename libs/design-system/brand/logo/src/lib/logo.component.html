<a
  class="logo"
  hraFeature="logo"
  hraClickEvent
  aria-label="Visit Human Reference Atlas"
  href="https://humanatlas.io/"
  target="_self"
  [inlineSVG]="data().src | assetUrl"
  [evalScripts]="NEVER_EVAL_SCRIPTS"
  [hraPlainTooltip]="tooltip()"
  [style.height]="`var(--hra-brand-logo-height, ${data().height}px)`"
  [style.width]="`calc(var(--hra-brand-logo-height, ${data().height}px) * ${data().width} / ${data().height})`"
>
</a>
