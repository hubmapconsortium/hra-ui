<div class="title">Oops! We’re having a moment.</div>
<div class="description">Try refreshing the page or report the issue if it continues.</div>
<div class="actions" hraFeature="server-error-page">
  <a mat-button hraCtaButton hraButtonVariant="primary" hraClickEvent hraLinkExternal [hraLink]="reportIssueLink()">
    Report issue
    <mat-icon iconPositionEnd>arrow_right_alt</mat-icon>
  </a>
  <a mat-button hraCtaButton hraButtonVariant="secondary" hraClickEvent hraLink="/">
    Go to homepage
    <mat-icon iconPositionEnd>arrow_right_alt</mat-icon>
  </a>
</div>
