@if (anchor(); as fragment) {
  <span class="link-container">
    <a mat-icon-button class="link" [attr.aria-labelledby]="labelId()" [hraFragmentLink]="fragment">
      <mat-icon class="icon">link</mat-icon>
    </a>
  </span>
}

<div class="content" [attr.id]="labelId()">
  <ng-content />
</div>

@if (underlined()) {
  <mat-divider />
}
