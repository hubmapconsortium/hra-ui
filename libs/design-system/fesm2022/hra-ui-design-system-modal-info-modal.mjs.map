<ng-container hraFeature="info-modal">
  <!-- A description list: each row holds a label (dt) and its value (dd) -->
  <dl class="details">
    @for (item of data(); track $index) {
      <div>
        <dt>{{ item.label }}</dt>
        <dd>{{ item.value }}</dd>
      </div>
    }
  </dl>

  <button
    mat-icon-button
    class="close"
    hraFeature="close"
    hraClickEvent
    [attr.aria-label]="closeLabel()"
    [hraPlainTooltip]="closeLabel()"
    (click)="close.emit()"
  >
    <mat-icon>close</mat-icon>
  </button>
</ng-container>
