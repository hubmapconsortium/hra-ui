<p class="heading">{{ content().heading }}</p>
<p class="description">{{ content().description }}</p>
<div class="actions">
  @for (button of content().actions; track button.action) {
    <button matButton="outlined" hraClickEvent [hraFeature]="button.action" (click)="actionClick.emit(button.action)">
      {{ button.label }}
    </button>
  }
</div>
