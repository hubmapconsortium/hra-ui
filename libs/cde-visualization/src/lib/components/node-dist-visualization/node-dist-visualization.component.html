<hra-expansion-panel tagline="Spatial view" disabled>
  <hra-expansion-panel-header-content>
    <cde-node-dist-visualization-controls
      [deleteAvailable]="hasSelection()"
      [compact]="compact()"
      [(viewMode)]="viewMode"
      (deleteClick)="deleteSelection()"
    />
    @if (fullscreenAvailable()) {
      <button
        mat-icon-button
        class="fullscreen"
        aria-label="Open the spatial view in full screen"
        hraPlainTooltip="Full screen"
        hraFeature="open-fullscreen"
        hraClickEvent
        (click)="fullscreen.open()"
      >
        <mat-icon>fullscreen</mat-icon>
      </button>
    }
  </hra-expansion-panel-header-content>

  <hra-fullscreen-portal
    tagline="Spatial view"
    panelClass="node-dist-vis-fullscreen-panel"
    (beforeOpened)="fullscreenChange.emit(true)"
    (beforeClosed)="fullscreenChange.emit(false)"
    #fullscreen
  >
    <hra-fullscreen-actions>
      <cde-node-dist-visualization-menu
        [hasDeletedCells]="hasDeletedCells()"
        [(edgesDisabled)]="edgesDisabled"
        (resetViewClick)="resetView()"
        (resetDeletedClick)="resetDeletedNodes()"
      />

      <cde-node-dist-visualization-controls
        [deleteAvailable]="hasSelection()"
        [compact]="compact()"
        [(viewMode)]="viewMode"
        (deleteClick)="deleteSelection()"
      />
    </hra-fullscreen-actions>

    <hra-fullscreen-portal-content>
      <hra-node-dist-vis
        cdkOverlayOrigin
        class="vis"
        data-testid="node-dist-vis"
        [attr.inert]="emptyState() ? '' : null"
        #cellInfoOrigin="cdkOverlayOrigin"
      />
      @if (loading()) {
        <cde-chart-skeleton />
      } @else if (emptyState(); as content) {
        <cde-empty-state hraFeature="empty-state" [content]="content" (actionClick)="emptyStateAction.emit()" />
      }
    </hra-fullscreen-portal-content>
  </hra-fullscreen-portal>
</hra-expansion-panel>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayDisposeOnNavigation]="true"
  [cdkConnectedOverlayHasBackdrop]="false"
  [cdkConnectedOverlayOpen]="cellInfoOpen()"
  [cdkConnectedOverlayOrigin]="cellInfoOrigin"
  [cdkConnectedOverlayPositions]="cellInfoPosition()"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="16"
  (overlayOutsideClick)="cellInfo.set(undefined)"
  #cellInfoOverlay="cdkConnectedOverlay"
>
  <hra-info-modal
    title="Cell info"
    data-testid="cell-info"
    [data]="cellInfoContent()"
    (close)="cellInfo.set(undefined)"
  />
</ng-template>
