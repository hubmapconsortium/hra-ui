<button
  mat-icon-button
  aria-label="More"
  hraPlainTooltip="More"
  hraFeature="menu"
  hraClickEvent
  [matMenuTriggerFor]="menu"
>
  <mat-icon>more_vert</mat-icon>
</button>

<!-- The fullscreen view covers the toolbar, so it keeps the distance visualization's own actions -->
<mat-menu class="vis-overlay" hraFeature="menu" #menu="matMenu">
  <button mat-menu-item hraFeature="reset-view" hraClickEvent (click)="resetViewClick.emit()">
    <mat-icon>fit_screen</mat-icon>
    Reset view
  </button>
  <button
    mat-menu-item
    hraFeature="restore-deleted-cells"
    hraClickEvent
    [disabled]="!hasDeletedCells()"
    (click)="resetDeletedClick.emit()"
  >
    <mat-icon>restore_from_trash</mat-icon>
    Restore deleted cells
  </button>
  <button
    mat-menu-item
    role="menuitemcheckbox"
    hraFeature="cell-links"
    hraClickEvent
    [attr.aria-checked]="!edgesDisabled()"
    (click)="$event.stopPropagation(); edgesDisabled.set(!edgesDisabled())"
  >
    <mat-icon>{{ edgesDisabled() ? 'check_box_outline_blank' : 'check_box' }}</mat-icon>
    Cell links
  </button>
</mat-menu>
