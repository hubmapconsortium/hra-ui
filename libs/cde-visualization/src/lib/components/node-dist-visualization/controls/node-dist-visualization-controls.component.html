@if (deleteAvailable()) {
  <button
    mat-icon-button
    class="delete"
    aria-label="Delete selected cells"
    hraPlainTooltip="Delete the selected cells from this dataset"
    hraFeature="delete-selected-cells"
    hraClickEvent
    (click)="deleteClick.emit()"
  >
    <mat-icon>delete</mat-icon>
  </button>
}

<mat-button-toggle-group
  aria-label="Visualization mode"
  hraFeature="toggle"
  [value]="viewMode()"
  (change)="viewMode.set($event.value)"
>
  @for (mode of viewModes; track mode.value) {
    <mat-button-toggle hraClickEvent [value]="mode.value" [hraPlainTooltip]="mode.tooltip" [hraFeature]="mode.value">
      {{ mode.label }}
    </mat-button-toggle>
  }
</mat-button-toggle-group>
