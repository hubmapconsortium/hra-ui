<div class="header">
  <h2 class="title" [id]="titleId">{{ content.title }}</h2>
  <button
    mat-icon-button
    hraIconButtonSize="large"
    hraFeature="close"
    hraClickEvent
    [attr.aria-label]="content.closeLabel"
    [hraPlainTooltip]="content.closeLabel"
    (click)="closeClick.emit()"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>

<div class="body">
  @for (group of content.groups; track group.heading) {
    <section class="group">
      <h3 class="group-heading">{{ group.heading }}</h3>
      @for (note of group.notes; track note.text) {
        <p class="note">
          {{ note.text }}
          @if (note.link; as link) {
            <a
              hraHyperlink
              hraFeature="embedding-guide"
              target="_blank"
              rel="noopener noreferrer"
              [attr.href]="link.url"
              >{{ link.label }}</a
            >
          }
        </p>
      }
      <ul class="files">
        @for (file of group.files; track file.id) {
          <li class="file" [hraFeature]="file.id">
            <cde-download-file [file]="file" (download)="download.emit({ file: file.id, format: $event })" />
          </li>
        }
      </ul>
    </section>
  }
</div>
