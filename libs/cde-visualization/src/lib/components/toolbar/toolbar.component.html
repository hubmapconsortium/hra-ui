<hra-navigation-rail [attr.aria-label]="content.label">
  <button
    hraNavigationRailItem
    icon="space_dashboard"
    hraFeature="panels"
    hraClickEvent
    [hraPlainTooltip]="content.panels.tooltip"
    [matMenuTriggerFor]="panelsMenu"
  >
    {{ content.panels.label }}
  </button>
  <button
    hraNavigationRailItem
    icon="layers"
    hraFeature="display"
    hraClickEvent
    [hraPlainTooltip]="content.display.tooltip"
    [matMenuTriggerFor]="displayMenu"
  >
    {{ content.display.label }}
  </button>
  <button
    hraNavigationRailItem
    icon="restart_alt"
    hraFeature="reset"
    hraClickEvent
    [hraPlainTooltip]="content.reset.tooltip"
    [matMenuTriggerFor]="resetMenu"
  >
    {{ content.reset.label }}
  </button>

  <mat-divider />

  <button
    hraNavigationRailItem
    icon="download"
    hraFeature="downloads"
    hraClickEvent
    [active]="openSheet() === 'downloads'"
    [hraPlainTooltip]="content.downloads.tooltip"
    (click)="openSheet.set('downloads')"
  >
    {{ content.downloads.label }}
  </button>
  <a
    hraNavigationRailItem
    icon="code"
    target="_blank"
    rel="noopener noreferrer"
    hraFeature="embed"
    hraClickEvent
    [attr.href]="content.embed.url"
    [hraPlainTooltip]="content.embed.tooltip"
  >
    {{ content.embed.label }}
  </a>

  @if (showThemeMenu()) {
    <button
      hraNavigationRailItem
      hraNavigationRailBottom
      hraFeature="theme"
      hraClickEvent
      [icon]="themeIcon()"
      [hraPlainTooltip]="content.theme.tooltip"
      [matMenuTriggerFor]="themeMenu"
    >
      {{ content.theme.label }}
    </button>
  }
  <button
    hraNavigationRailItem
    hraNavigationRailBottom
    icon="info"
    hraFeature="info"
    hraClickEvent
    [active]="openSheet() === 'about'"
    [hraPlainTooltip]="content.info.tooltip"
    (click)="openSheet.set('about')"
  >
    {{ content.info.label }}
  </button>
  <button
    hraNavigationRailItem
    hraNavigationRailBottom
    icon="help"
    hraFeature="help"
    hraClickEvent
    [hraPlainTooltip]="content.help.tooltip"
    [matMenuTriggerFor]="helpMenu"
  >
    {{ content.help.label }}
  </button>
</hra-navigation-rail>

<!-- Menu items: the label names the item and the supporting text under it describes it -->
<ng-template let-item let-id="id" #menuItemText>
  <span class="menu-item-text">
    <span [id]="id">{{ item.label }}</span>
    <span class="menu-item-description" [id]="`${id}-description`">{{ item.description }}</span>
  </span>
</ng-template>

<!-- Panel clicks stop propagating so the menu stays open while panels are shown and hidden -->
<mat-menu hraNavigationRailMenu hraFeature="panels-menu" #panelsMenu="matMenu">
  @for (panel of content.panels.options; track panel.id) {
    <button
      mat-menu-item
      role="menuitemcheckbox"
      hraClickEvent
      [hraFeature]="panel.id"
      [attr.aria-checked]="!hiddenPanels().includes(panel.id)"
      (click)="$event.stopPropagation(); togglePanel(panel.id)"
    >
      <mat-icon>{{ hiddenPanels().includes(panel.id) ? 'check_box_outline_blank' : 'check_box' }}</mat-icon>
      {{ panel.label }}
    </button>
  }
  <mat-divider />
  <button
    mat-menu-item
    hraFeature="show-all-panels"
    hraClickEvent
    [disabled]="hiddenPanels().length === 0"
    (click)="hiddenPanels.set([])"
  >
    <mat-icon>visibility</mat-icon>
    {{ content.panels.showAll }}
  </button>
</mat-menu>

<!-- Clicks stop propagating so the menu stays open while options are toggled -->
<mat-menu hraNavigationRailMenu hraFeature="display-menu" #displayMenu="matMenu">
  <button
    mat-menu-item
    role="menuitemcheckbox"
    hraFeature="cell-links"
    hraClickEvent
    [attr.aria-labelledby]="`${idPrefix}-cell-links`"
    [attr.aria-describedby]="`${idPrefix}-cell-links-description`"
    [attr.aria-checked]="cellLinks()"
    (click)="$event.stopPropagation(); cellLinks.set(!cellLinks())"
  >
    <mat-icon>{{ cellLinks() ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
    <ng-container
      *ngTemplateOutlet="menuItemText; context: { $implicit: content.display.cellLinks, id: `${idPrefix}-cell-links` }"
    />
  </button>
  <button
    mat-menu-item
    role="menuitemcheckbox"
    hraFeature="cell-link-data"
    hraClickEvent
    [attr.aria-labelledby]="`${idPrefix}-cell-link-data`"
    [attr.aria-describedby]="`${idPrefix}-cell-link-data-description`"
    [attr.aria-checked]="cellLinkData()"
    (click)="$event.stopPropagation(); cellLinkData.set(!cellLinkData())"
  >
    <mat-icon>{{ cellLinkData() ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
    <ng-container
      *ngTemplateOutlet="
        menuItemText;
        context: { $implicit: content.display.cellLinkData, id: `${idPrefix}-cell-link-data` }
      "
    />
  </button>
  <button
    mat-menu-item
    role="menuitemcheckbox"
    hraFeature="all-metadata"
    hraClickEvent
    [attr.aria-labelledby]="`${idPrefix}-all-metadata`"
    [attr.aria-describedby]="`${idPrefix}-all-metadata-description`"
    [attr.aria-checked]="allMetadata()"
    [disabled]="!hasHiddenMetadata()"
    (click)="$event.stopPropagation(); allMetadata.set(!allMetadata())"
  >
    <mat-icon>{{ allMetadata() ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
    <ng-container
      *ngTemplateOutlet="
        menuItemText;
        context: { $implicit: content.display.allMetadata, id: `${idPrefix}-all-metadata` }
      "
    />
  </button>
</mat-menu>

<mat-menu hraNavigationRailMenu hraFeature="reset-menu" #resetMenu="matMenu">
  <button
    mat-menu-item
    hraFeature="reset-view"
    hraClickEvent
    [attr.aria-labelledby]="`${idPrefix}-reset-view`"
    [attr.aria-describedby]="`${idPrefix}-reset-view-description`"
    (click)="resetViewClick.emit()"
  >
    <mat-icon>fit_screen</mat-icon>
    <ng-container
      *ngTemplateOutlet="menuItemText; context: { $implicit: content.reset.view, id: `${idPrefix}-reset-view` }"
    />
  </button>
  <button
    mat-menu-item
    hraFeature="restore-deleted-cells"
    hraClickEvent
    [attr.aria-labelledby]="`${idPrefix}-restore-deleted-cells`"
    [attr.aria-describedby]="`${idPrefix}-restore-deleted-cells-description`"
    [disabled]="!hasDeletedCells()"
    (click)="restoreDeletedCellsClick.emit()"
  >
    <mat-icon>restore_from_trash</mat-icon>
    <ng-container
      *ngTemplateOutlet="
        menuItemText;
        context: { $implicit: content.reset.deletedCells, id: `${idPrefix}-restore-deleted-cells` }
      "
    />
  </button>
  <button
    mat-menu-item
    hraFeature="reset-colors"
    hraClickEvent
    [attr.aria-labelledby]="`${idPrefix}-reset-colors`"
    [attr.aria-describedby]="`${idPrefix}-reset-colors-description`"
    (click)="resetColorsClick.emit()"
  >
    <mat-icon>settings_backup_restore</mat-icon>
    <ng-container
      *ngTemplateOutlet="menuItemText; context: { $implicit: content.reset.colors, id: `${idPrefix}-reset-colors` }"
    />
  </button>
  <mat-divider />
  <button
    mat-menu-item
    hraFeature="reset-everything"
    hraClickEvent
    [attr.aria-labelledby]="`${idPrefix}-reset-everything`"
    [attr.aria-describedby]="`${idPrefix}-reset-everything-description`"
    (click)="resetEverythingClick.emit()"
  >
    <mat-icon>restart_alt</mat-icon>
    <ng-container
      *ngTemplateOutlet="
        menuItemText;
        context: { $implicit: content.reset.everything, id: `${idPrefix}-reset-everything` }
      "
    />
  </button>
</mat-menu>

<mat-menu hraNavigationRailMenu yPosition="above" hraFeature="theme-menu" #themeMenu="matMenu">
  @for (option of content.theme.options; track option.id) {
    <button
      mat-menu-item
      role="menuitemradio"
      hraClickEvent
      [hraFeature]="option.id"
      [attr.aria-checked]="themePreference() === option.id"
      (click)="themePreference.set(option.id)"
    >
      <mat-icon>{{ themePreference() === option.id ? 'radio_button_checked' : 'radio_button_unchecked' }}</mat-icon>
      {{ option.label }}
    </button>
  }
</mat-menu>

<mat-menu hraNavigationRailMenu yPosition="above" hraFeature="help-menu" #helpMenu="matMenu">
  @for (link of content.help.links; track link.id) {
    <a
      mat-menu-item
      target="_blank"
      rel="noopener noreferrer"
      hraClickEvent
      [hraFeature]="link.id"
      [attr.href]="link.url"
    >
      <mat-icon>open_in_new</mat-icon>
      {{ link.label }}
    </a>
  }
</mat-menu>
