<ng-container hraFeature="cde-visualization">
  <mat-drawer-container class="drawer-container" (backdropClick)="closeDownloads('mouse')">
    <mat-drawer
      position="end"
      mode="over"
      disableClose
      role="dialog"
      aria-modal="true"
      hraFeature="downloads-drawer"
      [attr.aria-labelledby]="downloads.titleId"
      [attr.aria-describedby]="downloads.describedBy()"
      (opened)="onDownloadsOpened()"
      (keydown.escape)="closeDownloads('keyboard')"
      #downloadsDrawer
    >
      <cde-downloads
        [unavailable]="unavailableDownloads()"
        (closeClick)="closeDownloads($event)"
        (download)="handleDownload($event)"
        #downloads
      />
    </mat-drawer>

    <mat-drawer-content class="layout">
      <div class="metadata">
        <cde-metadata
          hraFeature="metadata"
          [metadata]="metadataView()"
          [loading]="metadataLoading()"
          [downloadsOpen]="downloadsDrawer.opened"
          (downloadsClick)="openDownloads()"
        />
        <cde-cell-types
          hraFeature="cell-types"
          [selectedCellType]="nodeTargetSelectorWithDefault()"
          [countAdjustments]="countAdjustments()"
          [loading]="cellTypesLoading()"
          [(cellTypes)]="cellTypes"
          [(cellTypesSelection)]="cellTypesSelection"
          (resetAllColors)="histogram.resetAllCellsColor(); resetCellTypes()"
          #cellTypesTable
        />
      </div>

      <div class="visualizations">
        <div class="top">
          <cde-node-dist-visualization
            hraFeature="visualization"
            [nodes]="nodesView()"
            [edges]="edgesView()"
            [maxEdgeDistance]="maxEdgeDistance()"
            [colorMap]="cellTypesAsColorMap()"
            [loading]="nodesLoading()"
            [emptyState]="visualizationEmptyState()"
            [(nodeFilter)]="nodeFilterView"
            (nodeClick)="nodeClick.emit($event)"
            (nodeHover)="nodeHover.emit($event)"
            (resetAllCells)="resetCellTypes()"
            (emptyStateAction)="selectAllCellTypes()"
          />

          <cde-violin
            hraFeature="violin-graph"
            [colors]="filteredColors()"
            [data]="filteredDistances()"
            [loading]="distancesLoading()"
            [emptyState]="chartsEmptyState()"
            (emptyStateAction)="selectAllCellTypes()"
          />
        </div>

        <cde-histogram
          hraFeature="histogram"
          [colors]="filteredColors()"
          [data]="filteredDistances()"
          [filteredCellTypes]="filteredCellTypes()"
          [loading]="distancesLoading()"
          [emptyState]="chartsEmptyState()"
          (updateColor)="updateColor($event.entry, $event.color)"
          (emptyStateAction)="selectAllCellTypes()"
          #histogram
        />
      </div>
    </mat-drawer-content>
  </mat-drawer-container>
</ng-container>
