<ng-container hraFeature="cde-visualization">
  <mat-drawer-container class="drawer-container">
    <mat-drawer
      position="end"
      mode="over"
      role="region"
      [hraFeature]="sheet() === 'downloads' ? 'downloads-drawer' : 'about-drawer'"
      [attr.aria-labelledby]="sheetLabelledBy()"
      [attr.aria-describedby]="sheetDescribedBy()"
      [opened]="openSheet() !== undefined"
      (closedStart)="openSheet.set(undefined)"
    >
      @if (sheet() === 'downloads') {
        <cde-downloads
          [unavailable]="unavailableDownloads()"
          (closeClick)="openSheet.set(undefined)"
          (download)="handleDownload($event)"
          (showAllPanelsClick)="showAllPanels()"
        />
      } @else {
        <cde-about (closeClick)="openSheet.set(undefined)" />
      }
    </mat-drawer>

    <mat-drawer-content class="layout" [class.visualizations-hidden]="!layout().visualizations">
      <cde-toolbar
        class="toolbar"
        hraFeature="toolbar"
        [hiddenPanels]="panelsHidden()"
        [cellLinks]="!edgesDisabled()"
        [hasHiddenMetadata]="hasHiddenMetadata()"
        [hasDeletedCells]="hasDeletedCells()"
        [showThemeMenu]="!hideThemeMenu()"
        [themePreference]="themeSwitch.preference()"
        [allCellsColor]="allCellsDisplayColor()"
        [(openSheet)]="openSheet"
        [(cellLinkData)]="showCellLinkData"
        [(allMetadata)]="showAllMetadata"
        (hiddenPanelsChange)="setHiddenPanels($event)"
        (cellLinksChange)="edgesDisabled.set(!$event)"
        (resetViewClick)="resetView()"
        (restoreDeletedCellsClick)="restoreDeletedCells()"
        (resetColorsClick)="resetColors()"
        (resetEverythingClick)="resetEverything()"
        (themePreferenceChange)="themeSwitch.setPreference($event)"
        (allCellsColorChange)="allCellsColor.set($event)"
      />

      <!-- Hidden panels stay rendered, so they keep their views and state -->
      <div class="metadata" [class.fill]="!layout().visualizations">
        <cde-metadata
          hraFeature="metadata"
          [class.panel-hidden]="!layout().metadata"
          [metadata]="metadataView()"
          [loading]="metadataLoading()"
          [showEmptyFields]="showAllMetadata()"
        />
        <cde-cell-types
          hraFeature="cell-types"
          [selectedCellType]="nodeTargetSelectorWithDefault()"
          [countAdjustments]="countAdjustments()"
          [loading]="cellTypesLoading()"
          [hideCellLinkData]="!showCellLinkData()"
          [(cellTypes)]="cellTypes"
          [(cellTypesSelection)]="cellTypesSelection"
        />
      </div>

      <div class="visualizations" [class.panel-hidden]="!layout().visualizations">
        <div class="top" [class.panel-hidden]="!layout().topRow" [class.fill]="!layout().histogram">
          <cde-node-dist-visualization
            hraFeature="visualization"
            [class.panel-hidden]="!layout().distanceVisualization"
            [nodes]="nodesView()"
            [edges]="edgesView()"
            [maxEdgeDistance]="maxEdgeDistance()"
            [colorMap]="cellTypesAsColorMap()"
            [loading]="nodesLoading()"
            [emptyState]="visualizationEmptyState()"
            [(nodeFilter)]="nodeFilterView"
            [(edgesDisabled)]="edgesDisabled"
            [(viewMode)]="viewMode"
            (nodeClick)="nodeClick.emit($event)"
            (nodeHover)="nodeHover.emit($event)"
            (emptyStateAction)="selectAllCellTypes()"
          />

          <cde-violin
            hraFeature="violin-graph"
            [class.panel-hidden]="!layout().violinGraph"
            [class.fill]="!layout().distanceVisualization"
            [colors]="filteredColors()"
            [data]="filteredDistances()"
            [loading]="distancesLoading()"
            [emptyState]="chartsEmptyState()"
            (emptyStateAction)="selectAllCellTypes()"
          />
        </div>

        <cde-histogram
          hraFeature="histogram"
          [class.panel-hidden]="!layout().histogram"
          [class.fill]="!layout().topRow"
          [colors]="filteredColors()"
          [data]="filteredDistances()"
          [filteredCellTypes]="filteredCellTypes()"
          [loading]="distancesLoading()"
          [emptyState]="chartsEmptyState()"
          [(allCellsColor)]="allCellsColor"
          (updateColor)="updateColor($event.entry, $event.color)"
          (emptyStateAction)="selectAllCellTypes()"
        />
      </div>
    </mat-drawer-content>
  </mat-drawer-container>
</ng-container>
